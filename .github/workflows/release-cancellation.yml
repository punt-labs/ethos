name: Release Cancellation

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.repository == 'punt-labs/ethos' &&
      github.event.workflow_run.head_repository.full_name == 'punt-labs/ethos' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: .punt-labs/biff
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Notify the Ethos release owner
        env:
          BIFF_RELAY_URL: ${{ vars.BIFF_RELAY_URL }}
          BIFF_RELAY_TOKEN: ${{ secrets.BIFF_RELAY_TOKEN }}
          BIFF_RELAY_TLS_HANDSHAKE_FIRST: ${{ vars.BIFF_RELAY_TLS_HANDSHAKE_FIRST }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          : "${BIFF_RELAY_TOKEN:?BIFF_RELAY_TOKEN is required to deliver Release cancellation alerts}"
          biff=(uvx --from punt-biff==1.24.2 biff --user github-actions --json)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/attempts/${RELEASE_RUN_ATTEMPT}"
          message="Release workflow cancelled on Ethos — ${run_url}"
          "${biff[@]}" wall "$message" --duration 24h
          current=$("${biff[@]}" wall)
          if ! jq -e --arg message "$message" '.text == $message' <<< "$current" >/dev/null; then
            echo "::error::Biff wall readback did not match the Release cancellation notification"
            exit 1
          fi
