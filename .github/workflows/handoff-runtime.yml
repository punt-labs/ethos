name: Handoff runtime

on:
  pull_request:
    paths:
      - .github/workflows/handoff-runtime.yml
      - .punt-labs/ethos/checks/snapshots/go-default.yaml
      - Makefile
      - go.mod
      - go.sum
      - scripts/build-handoff-runtime.sh
      - tests/e2e/pyproject.toml
      - tests/e2e/uv.lock
  workflow_dispatch:
    inputs:
      tag:
        description: New runtime release tag, e.g. handoff-runtime-v1
        required: true
        type: string

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate release request
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$TAG" =~ ^handoff-runtime-v[1-9][0-9]*$ ]]; then
            echo 'Dispatch on main with a new handoff-runtime-vN tag.' >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Install upstream ShellCheck
        run: |
          cd "$RUNNER_TEMP"
          asset=shellcheck-v0.11.0.linux.x86_64.tar.gz
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error \
            --connect-timeout 15 --max-time 180 --location --output "$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$asset"
          printf '%s  %s\n' b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$asset" | sha256sum --check
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Checkout z-spec (for its fuzz installer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: punt-labs/z-spec
          ref: 2d50236d81b1438f7e104fda18ff07d4f446cb60 # v0.20.5
          path: .tmp/handoff-z-spec
          persist-credentials: false
      - name: Install fuzz
        env:
          CFLAGS: -std=gnu17
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex
          .tmp/handoff-z-spec/install.sh --fuzz-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package the offline runtime
        run: |
          mkdir runtime-assets
          archive=$(scripts/build-handoff-runtime.sh runtime-assets)
          sha=$(basename "$archive" .tar.gz)
          asset=ethos-handoff-linux-amd64.tar.gz
          mv "$archive" "runtime-assets/$asset"
          printf '%s  %s\n' "$sha" "$asset" | tee "runtime-assets/$asset.sha256"
      - name: Smoke-test the relocated toolchain offline
        run: |
          scratch=$(mktemp -d)
          trap 'chmod -R u+w "$scratch"; rm -rf "$scratch"' EXIT
          mkdir "$scratch/runtime" "$scratch/home" "$scratch/tmp"
          tar -xzf runtime-assets/ethos-handoff-linux-amd64.tar.gz -C "$scratch/runtime"
          runtime="$scratch/runtime"
          sudo unshare --net --setuid "$(id -u)" --setgid "$(id -g)" -- env -i \
            HOME="$scratch/home" TMPDIR="$scratch/tmp" CI=1 \
            PATH="$runtime/go/bin:$runtime/bin:$runtime/python/bin:$runtime/node/bin:/usr/bin:/bin" \
            GOBIN="$runtime/bin" GOENV=off GOTOOLCHAIN=local GOPROXY=off \
            GOMODCACHE="$runtime/cache/go-mod" FUZZLIB="$runtime/fuzzlib" \
            UV_PYTHON="$runtime/python/bin/python3.13" UV_PYTHON_DOWNLOADS=never \
            UV_OFFLINE=1 UV_LINK_MODE=copy UV_CACHE_DIR="$runtime/cache/uv" \
            UV_PROJECT_ENVIRONMENT="$scratch/venv" npm_config_offline=true \
            npm_config_cache="$runtime/cache/npm" npm_config_update_notifier=false \
            bash -e -c 'go list ./... >/dev/null; golangci-lint version; shellcheck --version; uv sync --project tests/e2e --offline --locked; make docs fuzz-check'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-runtime-linux-amd64
          path: runtime-assets/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    concurrency: handoff-runtime-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handoff-runtime-linux-amd64
          path: runtime-assets
      - name: Publish content-addressed runtime
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^handoff-runtime-v[1-9][0-9]*$ ]] || exit 2
          cd runtime-assets
          sha256sum --check ethos-handoff-linux-amd64.tar.gz.sha256
          gh release create "$TAG" ethos-handoff-linux-amd64.tar.gz* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "Ethos handoff runtime $TAG" --notes-file - <<'NOTES'
          Offline Linux amd64 toolchain for the Ethos handoff gate.

          Upstream sources: [Go](https://go.dev/src/), [golangci-lint](https://github.com/golangci/golangci-lint),
          [ShellCheck](https://github.com/koalaman/shellcheck/tree/v0.11.0), [uv](https://github.com/astral-sh/uv/tree/0.13.9),
          [Python](https://github.com/python/cpython/tree/v3.13.18), [Node.js](https://github.com/nodejs/node/tree/v24.22.3),
          and [fuzz](https://github.com/Spivoxity/fuzz/tree/2a202a0b6f7328e729b54ef352d3bb4c6dfeb2e5).
          NOTES
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
