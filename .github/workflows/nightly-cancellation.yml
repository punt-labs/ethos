name: Nightly Cancellation

on:
  workflow_run:
    workflows: [Nightly]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.repository == 'punt-labs/ethos' &&
      github.event.workflow_run.head_repository.full_name == 'punt-labs/ethos' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ethos-nightly-biff-wall
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: |
            .punt-labs/biff
            scripts
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Notify the Ethos team
        env:
          BIFF_RELAY_URL: ${{ vars.BIFF_RELAY_URL }}
          BIFF_RELAY_TOKEN: ${{ secrets.BIFF_RELAY_TOKEN }}
          BIFF_RELAY_TLS_HANDSHAKE_FIRST: ${{ vars.BIFF_RELAY_TLS_HANDSHAKE_FIRST }}
          NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
          NIGHTLY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bash scripts/nightly-biff-wall.sh cancelled "$NIGHTLY_RUN_ID" "$NIGHTLY_RUN_ATTEMPT"
