name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      # make lint also runs ruff/mypy under tests/e2e via `uv run`; keep
      # this python-version pin in sync with tests/e2e/pyproject.toml's
      # requires-python.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'

      - name: Sync tests/e2e
        run: uv sync --project tests/e2e

      # make lint runs golangci-lint (bundles staticcheck); `make tools`
      # installs it from the Makefile's pinned GOLANGCI_LINT_VERSION to the
      # GOBIN path make lint resolves — single source for the version.
      - name: Install tools
        run: make tools

      - name: Run quality gates
        run: make lint test

      - name: Build binaries
        run: make dist VERSION=${GITHUB_REF_NAME#v}

      - name: Validate binaries
        run: |
          expected=4
          actual=$(find dist -name 'ethos-*' -type f | wc -l | tr -d ' ')
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Expected $expected binaries, found $actual"
            ls -la dist/
            exit 1
          fi
          echo "Found $actual binaries:"
          ls dist/ethos-*

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ethos-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ethos-*
            dist/checksums.txt
