name: Nightly

on:
  schedule:
    # Daily at 06:07 UTC (off-minute to avoid fleet collisions)
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      force-failure:
        description: Deliberately fail Nightly to test Biff alert delivery
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  behavioral:
    if: github.repository == 'punt-labs/ethos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -race -count=1
    timeout-minutes: 30
    steps:
      - name: Fail deliberately for the Biff alert drill
        if: github.event_name == 'workflow_dispatch' && inputs.force-failure
        run: |
          echo "::error::Deliberate Nightly failure for the Biff alert drill"
          exit 1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # plugin/hooks builds old binaries (93c9f82, v4.8.0) with git archive
          # to prove the shims block an old ethos. A depth-1 clone has neither.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Review test quarantine inventory
        run: make test-quarantine

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run behavioral tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETHOS_BEHAVIORAL_JUDGE_MODEL: ${{ vars.ETHOS_BEHAVIORAL_JUDGE_MODEL || 'claude-sonnet-4-6' }}
        run: go test -race -count=1 -tags behavioral -timeout 20m -v ./tests/behavioral/

  opencode-live:
    if: >-
      github.repository == 'punt-labs/ethos' && github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.force-failure)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check live credentials are configured
        env:
          BIFROST_VK: ${{ secrets.BIFROST_VK }}
          BIFROST_BASE_URL: ${{ vars.BIFROST_BASE_URL }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          : "${BIFROST_VK:?Set the BIFROST_VK Actions secret}"
          : "${BIFROST_BASE_URL:?Set the BIFROST_BASE_URL Actions variable}"
          : "${CONTEXT7_API_KEY:?Set the CONTEXT7_API_KEY Actions secret}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - name: Install OpenCode and isolated smoke dependencies
        run: bash scripts/ci-opencode.sh install
      - name: Verify the live OpenCode roster and exercise all smoke stages
        env:
          BIFROST_VK: ${{ secrets.BIFROST_VK }}
          BIFROST_BASE_URL: ${{ vars.BIFROST_BASE_URL }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: bash scripts/ci-opencode.sh smoke
      - name: Prepare publishable smoke receipts
        if: always()
        run: |
          shopt -s nullglob
          destination="$RUNNER_TEMP/opencode-receipts"
          for receipt in .tmp/opencode/smoke-*/receipt.json; do
            mkdir -p "$destination"
            run_dir=${receipt%/receipt.json}
            jq '{
              status, stage, scope, requested_stages, completed_stages,
              sessions: [.sessions[] | select(test("^ses_[A-Za-z0-9]+$"))],
              checks: [.checks[] | del(.parent, .child)]
            }' "$receipt" >"$destination/${run_dir##*/}.json"
          done
      - name: Upload OpenCode smoke receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-smoke-receipts
          path: ${{ runner.temp }}/opencode-receipts/*.json
          if-no-files-found: ignore
          retention-days: 7

  notify:
    needs: [behavioral, opencode-live]
    if: >-
      ${{ always() && github.repository == 'punt-labs/ethos' &&
          github.ref == 'refs/heads/main' &&
          contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .punt-labs/biff
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Notify the Ethos team
        env:
          BIFF_RELAY_URL: ${{ vars.BIFF_RELAY_URL }}
          BIFF_RELAY_TOKEN: ${{ secrets.BIFF_RELAY_TOKEN }}
          BIFF_RELAY_TLS_HANDSHAKE_FIRST: ${{ vars.BIFF_RELAY_TLS_HANDSHAKE_FIRST }}
          ALERT_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.force-failure }}
        run: |
          : "${BIFF_RELAY_TOKEN:?BIFF_RELAY_TOKEN is required to deliver Nightly alerts}"
          biff=(uvx --from punt-biff==1.24.2 biff --user github-actions --json)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          message="Nightly QA failure on Ethos — ${run_url}"
          if [[ "$ALERT_DRILL" == true ]]; then
            printf 'peers:\n  orgs: []\n  repos: []\n' > .punt-labs/biff/config.local.yaml
            current=$("${biff[@]}" wall)
            if ! jq -e '(.status == "inactive" and has("wall") and .wall == null)
                        or (.text | strings | startswith("DRILL: Nightly QA "))' <<< "$current" >/dev/null; then
              echo "::error::Nightly drill cannot replace an active non-drill wall or verify that the wall is safe to replace"
              exit 1
            fi
            message="DRILL: ${message}"
          fi
          "${biff[@]}" wall "$message" --duration 24h
          current=$("${biff[@]}" wall)
          if ! jq -e --arg message "$message" '.text == $message' <<< "$current" >/dev/null; then
            echo "::error::Biff wall readback did not match the Nightly notification"
            exit 1
          fi
