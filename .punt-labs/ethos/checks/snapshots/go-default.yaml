# Loaded by the DES-086 snapshot runner; the existing check set is unchanged.
checks:
  full-gate:
    profile: linux-worktree-v1
    epoch: ethos-v1
    sources:
      mode: worktree
    runtime:
      platforms:
        linux-amd64:
          bundle: ethos-handoff-linux-amd64.tar.gz
          # Publish the exact archive from Handoff runtime run 45738877712, not a rebuild.
          sha256: 30e086e0145ec47f0d6f3021a4e693fbbafb5b080beb152e404c51daa95edbee
          url: https://github.com/punt-labs/ethos/releases/download/handoff-runtime-v1/ethos-handoff-linux-amd64.tar.gz
          path: ["{runtime}/go/bin", "{runtime}/bin", "{runtime}/python/bin", "{runtime}/node/bin", /usr/bin, /bin]
          env:
            CC: gcc
            CI: "1"
            FUZZLIB: "{runtime}/fuzzlib"
            GOBIN: "{runtime}/bin"
            GOCACHE: "{scratch}/go-build"
            GOMODCACHE: "{scratch}/home/go/pkg/mod"
            GOPROXY: "off"
            MYPY_CACHE_DIR: "{scratch}/mypy-cache"
            PYTHONDONTWRITEBYTECODE: "1"
            RUFF_CACHE_DIR: "{scratch}/ruff-cache"
            UV_CACHE_DIR: "{scratch}/uv-cache"
            UV_LINK_MODE: copy
            UV_OFFLINE: "1"
            UV_PROJECT_ENVIRONMENT: "{scratch}/e2e-venv"
            UV_PYTHON: "{runtime}/python/bin/python3.13"
            UV_PYTHON_DOWNLOADS: never
            npm_config_cache: "{scratch}/npm-cache"
            npm_config_offline: "true"
            npm_config_update_notifier: "false"
    system:
      tools:
        - as
        - awk
        - bash
        - busybox
        - cat
        - chmod
        - cmp
        - cp
        - diff
        - dirname
        - env
        - find
        - gcc
        - git
        - grep
        - head
        - jq
        - ld
        - ln
        - make
        - mkdir
        - mkfifo
        - mktemp
        - mv
        - perl
        - ps
        - readlink
        - rm
        - sed
        - sh
        - sleep
        - sort
        - ssh-keygen
        - strace
        - tar
        - touch
        - tr
        - "true"
        - uname
        - wc
        - xargs
    scratch:
      # Private snapshot mounts at the paths written by the unchanged gate.
      checkout: [.tmp, tests/e2e/.pytest_cache]
      files: [coverage.out]
      seed:
        "{scratch}/home/go/pkg/mod": "{runtime}/cache/go-mod"
        "{scratch}/uv-cache": "{runtime}/cache/uv"
    git:
      base_ref: refs/remotes/origin/main
      refs: [refs/tags/v4.8.0]
    network: loopback
