name: go-default
description: Fast edit feedback and commit formatting, with the full gate at handoff.
checks:
  - name: gofmt
    stage: edit
    files: ["**/*.go"]
    run: [gofmt, -l, "{file}"]
    on_fail: advisory
    fail_on_output: true
  - name: vet
    stage: edit
    files: ["**/*.go"]
    run: [go, vet, "{package_dir}"]
    on_fail: advisory
  - name: shellcheck
    stage: edit
    files: ["**/*.sh"]
    run: [shellcheck, "{file}"]
    on_fail: advisory
  - name: gofmt-staged
    stage: commit
    files: ["**/*.go"]
    run: [gofmt, -l, "{files}"]
    on_fail: block
    fail_on_output: true
  - name: full-gate
    stage: handoff
    files: all
    run: [make, check]
    on_fail: block
    timeout: 30m
