        hazard, not a code defect. The diff itself is correct and isolated
        to the three write-set files (confirmed via `git diff --numstat
        03a36af~1..03a36af`); `make check` passes at HEAD. Success criterion
        "one commit" is not literally met because of this race — the leader
        should decide whether to split it out via a follow-up amend/rebase
        or accept it as-is, since further git surgery on a shared checkout
        risks compounding the collision.
