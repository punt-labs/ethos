context: 'Two related fixes surfaced while scoping an ethos-repo-only vendoring project. (1) internal/vendor/vendor.go:184-219 seeds() is a switch statement: v.opts.Team != "" and v.opts.Handles are mutually exclusive — when --team is set, explicit positional handles are silently dropped, no error. This contradicts the command''s own usage line ''ethos vendor [handle...] [flags]''. (2) .punt-labs/ethos/teams/engineering.yaml''s members: list (10 identities) is stale relative to what this repo''s own docs/development.md mission-pipeline table and docs/workflow.md org-roster table actually reference: rsc, rop, bcs, kth, jra, kpz, adt, ghr, edt, ach, ylc, gvr, kwb (13 more). Verified by grep across docs/*.md, DESIGN.md, and .punt-labs/ethos/missions/*/contract.yaml, then confirmed with a manual vendor dry-run seeding all 23 handles explicitly (bypassing the --team bug) which produced a self-consistent 23-identity closure with 26 ext files. The real target for this repo''s eventual vendor+repo-only migration is 23 identities, not engineering.yaml''s 10 and not the full 31-identity global roster.'
