      prose: |
        Implemented DES-065 (conservative/no-migration, model B) per DESIGN.md
        5e53ba2 + docs/seed-content-upgrade.md. Decision by content SHA-256 against
        a per-machine install manifest (~/.punt-labs/ethos/.seed-manifest.json):
        absent -> deploy+record; local==cur -> unchanged (adopt if untracked);
        tracked & local==mf & cur!=mf -> upgrade+record; tracked & local!=mf ->
        preserve (Edited); untracked & local!=cur -> today's no-clobber skip
        (Skipped, no write, no entry); zero-byte -> repair. --force overwrites all
        and records all. cur is hashed at runtime from the embedded bytes (no build
        step, no drift). Never touches ~/.punt-labs/ethos/identities/. Result gains
        Updated/Unchanged/Edited; Skipped keeps its meaning. Installer stays plain
        `ethos seed`, surfaces the --force hint on a local edit. Two commits:
        ab22376 (code+tests), 388ac75 (installer+CHANGELOG).
