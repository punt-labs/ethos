        Wrote docs/design-opencode-plugin.md: the concrete OpenCode V2 plugin
        design implementing the spec's Registry model, grounded entirely in
        the .tmp/ reference material (real OpenCode V2 source/docs) and the
        companion PR/FAQ, never asserted from memory. Covers lifecycle hooks,
        the parent/child session mapping, commit-trailer resolution (zero
        changes to existing Go code -- the whole OpenCode engineering problem
        is correct ETHOS_SESSION propagation, not new resolver logic),
        fail-closed behavior with an explicit never-guess-a-session-ID
        section, and rejected alternatives for both named hardest decisions
        (4 for fork attribution, 3 for commit-trailer resolution), each with
        its own rejection rationale grounded in either the spec's own
        documented exploit traces or a real ethos incident (ethos-vqwn,
        DES-074). Added DESIGN.md's DES-078 ADR recording the decision.
        Two commits, each scoped exactly to one write_set file, make docs
        clean after each. Two open items are disclosed rather than guessed
        past: whether env propagation reaches every OpenCode commit path, and
        OpenCode's own restart-liveness signal -- both inherited from the
        companion research's own disclosed gaps, named explicitly in the new
