      prose: |
        Fixed both Bugbot regressions coherently.

        (1) Store.LoadCorrections now returns (corrections, warnings, err)
        mirroring LoadEvents' own shape instead of upgrading warnings to a
        hard error. Updated all 5 callers (cmd/ethos/mission.go
        runMissionShow's two paths + runMissionResults; internal/mcp/mission_tools.go
        handleShowMission + handleResultsMission) to surface warnings
        advisorily -- stderr print + JSON warnings field -- rather than
        failing. runMissionResults' own LoadCorrections err (a genuine I/O
        failure) stays fatal, matching the existing LoadResults and
        runMissionLog's LoadEvents convention -- only decode warnings became
        advisory, not the hard-error path.

        (2) internal/ui's handleMission now sets a new CorrectionsWarnings
        field when eventsErr is nil but warnings is non-empty, rendered in
        mission.html alongside the existing EventsWarnings block, so a
        partially-corrupt log with an otherwise-healthy union no longer
        renders a clean Corrections section.

        Test changes: internal/mission/correct_test.go's LoadCorrections
        test now proves warnings-not-error (previously it asserted a hard
        failure). While rewriting it, discovered the original test's
        seedLogLines call duplicated the correct event against the DES-058
        live-tail union -- appendEventLocked writes to the per-session live
        log, not the legacy log.jsonl seedLogLines targets, so reconstructing
        all events into the legacy slot double-counted them. This was masked
        before by the test asserting a hard error (nil corrections). Fixed
        by appending only the corrupt line to the legacy slot, leaving the
        live-tail's real event undisturbed. Also updated
        internal/mcp/mission_tools_test.go and cmd/ethos/mission_test.go for
        the new 3-value signature, and added a new integration test
        (internal/ui/handlers_test.go:TestHandleMission_RendersCorrectionsWarningsOnPartialLog)
        that seeds a real corrupt legacy-log line via a live Store and
        asserts the readable correction still renders alongside a visible
        warning through the actual HTTP handler, not just template-only
        rendering.

        make check (full suite, race detector, all languages: Go, Python,
        shellcheck, markdownlint, validate-content) passes clean.
