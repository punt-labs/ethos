success_criteria:
    - 'Bugbot HIGH finding on internal/mission/correct.go (~line 274-278): Store.LoadCorrections now turns soft LoadEvents decode warnings into a hard error (fmt.Errorf), but two real callers treat any LoadCorrections error as fatal: cmd/ethos/mission.go runMissionResults (~line 1302, the plain "ethos mission results" command, both text and --json paths -- "return fmt.Errorf(...)") and internal/mcp/mission_tools.go handleResultsMission (~line 626-628, "return mcplib.NewToolResultError(...)"). A partially corrupt mission event log now blocks reading results.yaml entirely through both of those paths, when it should only be an advisory warning (same severity LoadEvents warnings already get everywhere else). Fix: change Store.LoadCorrections signature to return (corrections []Correction, warnings []string, err error) -- mirroring LoadEvents own shape -- instead of upgrading warnings to a hard error. Update every caller: cmd/ethos/mission.go (all 3 call sites: runMissionShow ~1211, the mission-show-corrections helper ~1247, runMissionResults ~1302) to surface warnings the same advisory way LoadResults/LoadEvents warnings already are (stderr print + JSON warnings field, never a hard failure); internal/mcp/mission_tools.go (both call sites ~298 and ~626) to add warnings to the response payload rather than erroring out.'
    - 'Bugbot MEDIUM finding on internal/ui/handlers.go (~line 164-198): handleMission derives Corrections via mission.CorrectionsFromEvents whenever eventsErr is nil, even when the warnings slice from loadEvents is non-empty, and never sets CorrectionsError for that case -- a corrupt line that silently dropped a correct event still renders a healthy-looking Corrections section. Fix: when eventsErr is nil but warnings is non-empty, still set data.CorrectionsError (or a distinct CorrectionsWarnings field rendered the same way) so the dashboard cannot show a clean Corrections section over a partially-unreadable log.'
    - 'These two findings share a root cause (warnings from LoadEvents not reliably reaching every Corrections consumer) -- implement coherently, not as two unrelated patches. Update or add tests proving: (a) a partially corrupt event log makes ethos mission results and the MCP results method return warnings but still return the readable results/corrections, not an error; (b) the UI dashboard sets a corrections warning when events warnings are non-empty even though eventsErr is nil.'
    - Ignore the "missing mission index entries" Bugbot comment on .punt-labs/ethos/missions.jsonl -- that finding is stale, already fixed in an earlier commit on this branch (39acbaa), and Bugbot re-ran clean on it in the intervening CI run before this comment reappeared on the review UI.
    - make check passes, including make check-oo if present.
    - Commit incrementally, each commit passing make check. Do not accumulate more than 30 minutes of uncommitted changes.
