    - Each typed entity --help gains a one-line pointer to its schema subcommand. Keep --help about usage and schema about shape. List rejected alternatives (a top-level ethos schema command; a --schema flag; enriching create --help; hand-maintained per-dir READMEs) with reasons. Include open questions for the leader. Commit the design doc; markdownlint clean.
