    - 'DESIGN ONLY (write-set is docs). Produce docs/entity-schema-command.md plus a DES ADR draft for a schema subcommand added to the three typed entities: identity, role, team. It sits alongside their existing create/list/show verbs (operator confirmed the per-entity subcommand shape, e.g. ethos team schema, NOT a top-level ethos schema command). Attributes (personality, talent, writing-style) are markdown title-plus-prose and are explicitly EXCLUDED.'
