      prose: |
        Z specification of the mission-contract lifecycle as implemented today
        in internal/mission (mission.go, store.go, validate.go): five statuses,
        the seven named transitions (create, delegate, submit-result, reflect,
        advance-round, close, abandon), and the invariants they must jointly
        preserve (round budget, evaluator-hash pinning, close-requires-result,
        abandon-requires-no-work). Every predicate is cited to its Go source
        location; a Non-goals section and a Traceability table make the scope
        and the mapping explicit.

        The mission's central validation ask -- confirm the spec's invariants
        would flag the fail-open abandon bug (abandon_test.go's
        TestStore_Abandon_RefusesWhenRepoRootEmpty) as a violation -- required
        correcting my own first attempt. Typing a buggy AbandonFailOpen
        operation directly against \Delta Mission, with the safety invariant
        baked into Mission's own predicate, does NOT surface a violation: Z's
        schema calculus silently folds the invariant into every \Delta Mission
        operation's precondition, so ProB reports 0 violations across 385
        states regardless of how badly the guard is written -- a false
        negative I discovered empirically, not a mechanism I predicted in
        advance. This is documented as an erratum in the spec itself (S8.3),
        not smoothed over.

        The working demonstration decouples the safety property from the
        type: two small self-contained Z documents share a stripped-down
        MissionU state schema with no baked-in invariant, plus an Idle
        self-loop excluded exactly from the unsafe region, turning the
        safety property into a deadlock question ProB can answer directly.
        The fail-open guard reaches a genuine, reproducible deadlock (16
        states, 35 transitions, trace: Init -> Delegate -> AbandonFailOpen
        -> stuck at status=stAbandoned, delegationCount=1); the correct
        guard does not (15 states, 29 transitions, clean). Both documents
        and their exact ProB output are reproduced in full inside the
        committed spec's Validation section, so a future reader can rerun
        them without access to my scratch files.

        Every commit type-checks clean with fuzz (0 errors). Committed in
        two logical steps on docs/z-spec-mission-lifecycle: state
        space/transitions, then invariants/validation/traceability.
