      prose: |
        Five commits, one per bug, each with its tests.

        qy7k: pathContainedBy matches entry segments against a leading run of the
        file segments, with ** spanning any number of segments and */? matching
        within one. Non-glob entries are byte-identical in behavior, so the DES-036
        parent-claim refusal stands. The hook's pathAllowed now calls the same
        matcher through the exported mission.PathContainedBy.

        7vo3 (item A only): mission create and mission dispatch bind the session to
        the mission just named, warning on a rebind and clearing the previous
        dispatch's delegation binding. The hook refuses a sidecar naming a
        non-open mission and spawns Tier A with a warning. A sidecar the store
        cannot resolve still blocks, as DES-054 round 3 settled. No contract
        invariant moves.

        pobi: the commit-msg fallback asks ethos hook commit-trailers, which
        resolves the committing session (ETHOS_SESSION, else the PID walk) and
        reads only that session's sidecars. Unresolved means no trailer.

        t2lb: one splitter (mission.SplitPathList, commas and whitespace) serves
        both the CLI path-list flags and pipeline template expansion, so a
        multi-path --var becomes distinct, individually admission-checked entries.

        u4kq: FindBy refuses more than one match, naming every candidate sorted.
        Zero and one match are unchanged, so LayeredStore precedence is untouched.

        PR #415 open, Copilot review requested once. Not merged.
