      open_questions:
        - MCP parity (already a follow-up bead) is untouched here - internal/mcp/handleCreateMission still does not rebind the session, so the 7vo3 attribution fix covers the CLI path only.
        - internal/mission/lint.go still compares write_set entries literally, so a glob entry may draw a spurious advisory warning. Advisory only, and now inconsistent with both the containment and the overlap checks.
        - A write_set path containing a space is no longer expressible through --write-set, --extract-into, or a pipeline --var. Ratified by the leader as the right trade for one splitter over two that drift.
      prose: |
        Round 2 closes the four must-fix findings rsc raised on PR #415, plus
        the doctor.go wording defect and the test-placement minor.

        1. qy7k had moved the invariant it was told not to move. Containment
        became glob-aware while pathsOverlap stayed literal, so two open
        missions could claim docs/** and docs/a.md and both be admitted.
        pathsOverlap now compares a glob entry by the literal prefix before
        its first glob segment, and an entry that globs from its first
        segment is a root claim overlapping everything. Truncation only
        shortens the compared list, so admission refuses more, never less.
        validateWriteSetEntry rejects all-metacharacter entries.

        2. pobi did not do what its commit message claimed. An ethos too old
        to know `hook commit-trailers` printed help on stdout and exited 0,
        so the failure guard never fired. Root cause is cobra's ordering:
        `if !c.Runnable() { return flag.ErrHelp }` precedes ValidateArgs, so
        NoArgs alone was inert on a parent with no Run. hookCmd now carries
        both, and the shell hook treats help-shaped output as failure.

        3. t2lb widened claims silently. Both surfaces now name the entries
        whenever a value splits; the flag help says commas or spaces.

        4. Leader ruling: a dispatch binding must not produce commit
        trailers. The sidecar records how the binding was made; claim
        produces trailers, dispatch does not, delegation filing is unchanged.
        A sidecar with no origin line reads as claim, so existing sessions
        keep their trailers across the upgrade. A rebind and a
        dispatch-over-claim each print a line so the change is never silent.

        Two files in the diff are outside this contract's write_set and both
        are authorized, not scope creep:

        - internal/mcp/mission_tools_test.go — a one-line assertion update
          applied by the leader. That test pins the active-mission sidecar's
          on-disk bytes, which the ruling deliberately changed. I escalated
          rather than edit it myself.
        - internal/doctor/doctor.go and doctor_test.go — the leader
          authorized this as a review-cycle fix. My u4kq change created a new
          error class that the check's "no match — " prefix contradicted; the
          detail is now the resolver's own error.

        PR #415 tip is 946fbdb. Not merged.
