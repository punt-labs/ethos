      open_questions:
        - The MCP mission create path (internal/mcp/mission_tools.go) is outside this write_set, so an MCP-created mission does not rebind the session's active mission the way the CLI now does. The stale-binding class is closed on the CLI path only; a follow-up mission should bring MCP to parity.
        - mission lint's write_set coverage heuristic (internal/mission/lint.go) still compares entries literally, so a glob write_set may draw a spurious advisory warning. Lint is advisory and out of this bug's scope, but it is now inconsistent with the containment check.
