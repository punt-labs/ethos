      prose: |
        Round 2: fixed the three items evaluator adt's reflection named, all
        missed in round 1 because they are not hook-call syntax.

        1. opencode.json plugin-config key (lines ~70, ~436): renamed the V1
           singular "plugin" array key to V2's "plugins" array, and noted the
           entry shape changed to a {package, options} object, at both
           citation sites in the document.
        2. Worktree/concurrency FAQ (lines ~232-244): replaced the claim that
           setup(ctx)'s context carries flat `directory`/`worktree` fields
           (cited to the V1 stable-docs page) with the correct V2 shape:
           `directory` survives as `ctx.location.directory`; `worktree` does
           not survive as a flat field -- V2 exposes it as a structured
           per-project domain API (`ctx.worktree.create/list/refresh/remove`,
           each requiring a projectID). Re-cited to migrate-v1.mdx (for the
           directory rename) and index.mdx (for the ctx.worktree.* shape).
           Updated the paragraph's reasoning and the later `(worktree, ...)`
           key-tuple reference to `(ctx.location.directory, ...)`, since
           ctx.location.directory alone is sufficient to disambiguate
           concurrent worktree checkouts for this integration's purpose.
        3. Disclosure-note overclaim ("that syntax has been replaced
           throughout"): left the sentence as-is, since fixing items 1 and 2
           makes the claim true rather than requiring it to be softened.

        Did a full re-sweep beyond the three named items, per the request to
        check the whole document before this final round: grepped for the V1
        factory-destructure signature, the bare "Hooks" return type, the
        opencode.json singular-key pattern, chat.message/chat.params/
