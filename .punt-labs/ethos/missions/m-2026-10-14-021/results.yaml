          `ctx.shell.hook(...)`, `ctx.permission.hook(...)`,
          `ctx.event.subscribe()`).
        - Added a sourcing/correction note at the top of that FAQ: targets
          OpenCode V2 (confirmed released, v2.0.26 installed), citing
          migrate-v1.mdx, and disclosing that an earlier draft used V1 syntax
          sourced from the stable docs site before V2's release was confirmed.
        - Session-fork FAQ: changed "the plugin's `session.created` hook
          fires" to "the plugin's `ctx.event.subscribe()` loop observes a
          `session.created` event"; changed "hook payload"/"hook event shape"
          to "event payload" in the surrounding confidence paragraph. Left
          the session.fork HTTP endpoint content, the
          context.data.session.root/family lineage-lookup content, and the
          Claude Code `source: "fork"` citation untouched (unaffected,
          confirmed correct).
        - Ethos-restart FAQ: no V1 hook-registration syntax was present in
          this section; left unchanged except the already-correct
          context.data.session.status content, which needed no fix.
        - Worktree/concurrency FAQ: changed "every plugin hook context" to
          "the plugin's setup(ctx) context" (still carries directory/worktree
          fields; unaffected content preserved).
        - Bundled-plugin recommendation: replaced the description of how the
          plugin would be structured and triggered with
          `Plugin.define({id, setup(ctx)})` + `ctx.event.subscribe()` for
          session.created/session.updated; replaced the standalone-adapter
          option's `tool.execute.before` reference with
          `ctx.tool.hook("execute.before", ...)`.
        - "What I could not verify" section: changed "plugin hook's event
          payload" to "event's payload" for internal consistency; left the
          confidence/sourcing claims themselves untouched.

