      prose: |
        PROVENANCE — read this before treating the author field at face value.

        This result is authored by the LEADER, not the worker. The worker
        (bwk, spawned in session e1e5a0da) reported each round conversationally
        via SendMessage and its session ended before submitting a formal result
        artifact. Rather than author prose under the worker's handle for an
        agent that cannot confirm it, the leader records the outcome under its
        own handle and attests to it from independently verified evidence: the
        merged PR, the CI results, and the detached test gate the leader ran
        itself on every round.

        That gap is itself a finding. The mission protocol requires a result
        artifact to close, but nothing prompts the worker to submit one before
        its session ends, so a completed mission can strand in the open state
        with all its work merged. This mission stranded exactly that way, and
        only surfaced because the write-set conflict check — shipped by this
        very mission — refused to create the follow-up mission while this one
        stayed open. Dogfooding caught it.

        THE CENTRAL RESULT: the contract's premise held. Four of the five
        triaged bugs were one defect, not four — internal/mission carried two
        storage layers that disagreed about scope, and different call sites
        picked different layers. Writing the layer model down first (DES-075),
        as the contract required, is what made the code changes follow rather
        than be guessed at.

        THE MOST VALUABLE FINDING came from a documentation nit, not from the
        bug list. A reviewer flagged that a comment named the wrong directory.
        Correcting it forced a written answer to why one half of a scan needed
        two checkout roots and the other did not — and the written answer was
        false, which a direct filesystem measurement proved. Behind the false
        sentence was a real false-negative in admission control. Prose precise
        enough to be falsified is worth more than prose that is merely
        agreeable.

        COST, stated plainly: 10 review rounds, 30 findings, 9 of them defects
        in the fixes themselves. Every one of those 9 was in a failure path or
        an edge case; none in the happy path. That ratio is the argument for
        the review cycle, not against it.
