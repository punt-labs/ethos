context: |
    Cluster 2 of the ethos bug triage: mission state persistence. Five beads,
    two P1s. All five were triaged by the leader on 2026-09-07 with measured
    mechanisms recorded on each bead — read those notes before anything else.

    The headline is that this is NOT five independent bugs. Four of them are
    one defect: internal/mission carries two storage layers that disagree
    about scope, and different call sites pick different layers. Enumeration
    spans both. Locking uses one while the data lives in the other.
    Resolution uses only one. Fixing these one at a time means three or four
    passes over the same ambiguity, each patching a symptom without settling
    what the layers mean — which is why the ADR comes first.

    Three of the five beads record a mechanism that turned out to be wrong,
    and the triage notes correct them. ethos-6adb blamed cwd resolution; it is
    the unscoped global tree. ethos-lj4k said Abandon is unlocked; it holds a
    different lock file. ethos-7tqd said orphans are inert; they capture the
    next agent spawned. Building to the original text will produce fixes that
    miss.

    Prior art worth reading: PR #507 (merged ec47a92) fixed the same
    asymmetry shape one package over — session.WriteCurrentSession was a plain
    non-atomic write while writeRoster beside it was fully atomic. ouy9's
    writeContract is that defect again. DES-074 in DESIGN.md is the decision
    record for the session-identity work that preceded this cluster.
