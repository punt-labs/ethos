        - The contract's premise that the roles live in a punt-labs/team submodule is false for this repo. There is no .gitmodules and git submodule status is empty; .punt-labs/ethos/roles/*.yaml are ordinary tracked files of punt-labs/ethos. The team submodule exists in the workspace repo and holds a different, smaller role set (11 files) that lacks z-specialist and b-specialist entirely, so the contract as written could not be executed there. Work done in punt-labs/ethos, which is where the write-set resolves and where the named roles exist. An org-wide grant needs a separate PR against punt-labs/team for its 9 specialist roles.
        - 'Three granted tools are not purely read-only and should be ruled on rather than assumed: ethos identity carries a create method, ethos session carries purge, and biff plan writes a status string. MCP scoping is per-tool, not per-method, so the read halves cannot be granted alone. All three act on local or status state rather than on another agent or an external service, which is why they were granted as instructed — flagged, not deviated.'
        - The regenerated .claude/agents/ files are not in the diff; committing them would reach outside the write-set. Generation is idempotent and runs at SessionStart, so they update in every checkout on the next session. Leader decides whether they should ship in this PR.
        - No CHANGELOG entry, for the same write-set reason. The change is user-facing (specialists gain MCP tools), so the pre-PR checklist wants one. Leader decides whether to re-scope or add it.
