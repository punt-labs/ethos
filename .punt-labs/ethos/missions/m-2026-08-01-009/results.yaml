      prose: |
        A sub-agent's MCP access is gated by the tools: list its role supplies.
        A specialist scoped to Read/Write/Edit/Bash/Grep/Glob therefore reaches
        no MCP server at all — it cannot recall a memory, search the corpus,
        read its mail, or ask ethos who it is. Confirmed from this session: the
        MCP server instruction blocks are injected into a scoped specialist's
        context, but the tools themselves are absent.

        The fix is 37 role files and no code. Each specialist role gains eleven
        named inbound tools; the two formal-methods roles gain six more for the
        Z toolchain. The security property is that the boundary is the list
        itself: no outbound tool appears, so none can be reached.

        Names are explicit rather than the wildcard. The wildcard is smaller to
        write and wrong twice over — it would grant quarry's delete and its
        three registration tools, and it would hide from an auditor exactly
        what a specialist can do.

        Withheld by name: quarry delete, register_directory,
        deregister_directory, sync_all_registrations; biff write, wall, talk,
        mesg, who, finger, last; ethos mission, role, team, ext, adr, vendor,
        doctor; every beadle, GitHub, and lux tool.

        The boundary is verified by exhaustion rather than by denylist. The
        complete inventory of every mcp__ name appearing in any of the 27
        generated agent files is seventeen distinct names: the eleven inbound
        tools on all 27, and the six z-spec tools on exactly two. There is
        nothing else to find, so there is nothing an outbound name could hide
        behind. Diffing every tool line of the committed agents against the
        regenerated ones gives 305 additions and zero removals.

        Delivered as PR punt-labs/ethos#424 in two commits, 767c4b1 and
        2b85237, each passing make check.
