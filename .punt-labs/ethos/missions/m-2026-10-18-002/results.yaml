      prose: |
        Fixed both round-1 gaps the evaluator flagged.

        Finding 2 (status-as-liveness cache ambiguity): added an explicit
        caveat to the restart FAQ stating that a bare
        context.data.session.status() call cannot distinguish an
        unknown/never-existed session from a genuinely idle one, since
        status() reads a cached value with no server round-trip by default; a
        liveness check must call sync() first and read the post-sync value,
        or treat an unsynced status() read as inconclusive.

        Finding 6 (hook-plugin vs CLI/TUI-plugin context): independently
        verified via quarry by ingesting and reading effect.mdx's own
        interface Context declaration in full (35 pages indexed, page 9 read
        directly). Confirmed verbatim field list matches the leader's claim
        exactly -- app, location, options, agent, aisdk, command, event,
        experimental, integration, mcp, model, generate, permission, plugin,
        provider, reference, rpc, session, shell, skill, storage, tool, vcs,
        websearch, worktree -- with no data field. Wrote this finding into
        the fork FAQ, the restart FAQ, and the "What I could not verify"
        section, correcting every prior claim that context.data.session.*
        was "a separately useful, independently confirmed general-purpose
        mechanism" available to the bundled hook-plugin.

        For the restart FAQ's liveness recommendation specifically: stated
        plainly that no primitive is currently confirmed reachable from the
        hook-plugin's own Context for restart-liveness detection, named two
        unconfirmed candidates (ctx.session.get(), and the
        session.idle/session.status/session.updated/session.deleted event
        types from ctx.event.subscribe()), and did not fabricate a confirmed
        answer.

        For the bundled-plugin recommendation itself: gave an explicit
        reasoned answer that it survives unchanged, because the integration's
        core requirements (SessionEvent.Forked-based fork handling,
        ETHOS_SESSION propagation) never depended on context.data.session,
        and a TUI-package sibling export would sit unused in the headless
        opencode serve deployment this integration actually targets.

        Verification: ran quarry ingest on
        github.com/anomalyco/opencode/blob/dev/services/www/src/docs/content/build/plugins/effect.mdx
        (35 pages indexed), then quarry show --page 9 to read the full
        interface Context declaration directly -- an independent
        confirmation, not a restatement of the leader's claim. Ran npx
        markdownlint-cli2 "**/*.md" "#node_modules" per this repo's make docs
        target: 0 issues in 333 files.
