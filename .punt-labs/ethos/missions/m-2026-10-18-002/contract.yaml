      (4) MISSION-STORE ISOLATION CLAIM IS WRONG (High, Copilot, line ~253). Cites internal/resolve/resolve.go:729-769 (StoreRepoRoot resolves linked worktrees to the SHARED main-worktree store) and cmd/ethos/mission.go:2093-2116 (mission claim writes a GLOBAL session sidecar, not missions/<id>). This is about THIS repo's own ethos source, not OpenCode -- read those exact line ranges in this repo's own internal/resolve/resolve.go and cmd/ethos/mission.go and confirm or refute directly. If confirmed, the worktree-independence claim in this document is wrong about how ethos's OWN existing mechanism works, and needs correcting to reflect the real storage model (or propose what WOULD need to change in ethos to make worktree isolation true, clearly labeled as a required change rather than an existing property).

