      (1) FORK LINEAGE IS WRONG (High, Cursor + Copilot, lines ~123-136, ~203-219, ~441-450). Copilot cites packages/client/src/solid/data.ts: root/family lookups follow only parentID, while packages/core/src/session/projector.ts creates forks with parent_id: null and a separate fork_session_id. If true, a fork resolves to its OWN hierarchy root, not the source session's -- so context.data.session.root/family CANNOT discover the parent's mission claim the way this document's fork-handling FAQ and the companion Z-spec both assume. Read both cited files directly in the actual anomalyco/opencode source (clone or context7) and determine: does root/family genuinely fail to bridge a fork to its pre-fork session? If confirmed, the fork FAQ needs a different lineage mechanism -- find what field (fork_session_id? something else?) actually links a fork to its source, and revise the lookup recommendation. This finding, if real, also invalidates part of the companion Z-spec's AllocateDelegationForkPropagated witness mechanism -- flag this explicitly in your result so the leader can relay it to the parallel spec-correction mission (m-2026-10-18-001) rather than have both missions fix it independently and inconsistently.

