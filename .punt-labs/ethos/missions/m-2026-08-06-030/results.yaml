      prose: |
        Fixes ethos-q682. Added `ethos mission scaffold contract` and `ethos
        mission scaffold result` under cmd/ethos/mission.go, backed by
        internal/mission/scaffold.go (ScaffoldContractYAML,
        ScaffoldResultYAML). Both print a commented, fillable-in-place YAML
        skeleton to stdout — no flags, redirect to a file — with every field
        the real strict decoder and Validate() require present and typed,
        removing the discover-by-error class the bead reports (mission ->
        round -> author -> evidence non-empty -> EvidenceCheck shape for
        results; the parallel chain for contracts).

        Server-computed contract fields (mission_id, status, timestamps,
        evaluator.pinned_at/hash, current_round) are deliberately omitted
        from the contract scaffold since `mission create` overwrites them
        regardless of what the file supplies; advanced/rare fields
        (pipeline, depends_on, extract_into, tools, preconditions,
        delegations, session, repo) are named in a comment pointing to
        `mission create --help` rather than scaffolded, to keep the skeleton
        minimal.

        internal/mission/scaffold_test.go proves both skeletons round-trip
        through the real DecodeContractStrict/DecodeResultStrict unmarshaler
        with zero errors, and that their own fields independently satisfy
        Contract.Validate/Result.Validate (the contract test fills in the
        server-computed fields the same way Store.Create does, matching
        production behavior). Caught and fixed one real bug via dogfooding:
        cobra panics if a non-root-child command sets GroupID for a group
        only registered on rootCmd — missionScaffoldCmd is a child of
        missionCmd, not rootCmd, so it must not set GroupID (matching every
        other mission subcommand).

        This mission's own write_set (cmd/ethos/mission.go,
        internal/mission/scaffold.go) is fully clean under go vet,
        golangci-lint, and go test. The one open item is the repo-wide
        `make check` failure, which traces to unrelated concurrent
        in-progress work outside this write_set — see open_questions.
