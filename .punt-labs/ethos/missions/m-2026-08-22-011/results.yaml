      prose: |
        Fixed the two gaps code-reviewer found on feat/vendor-repo-only:

        1. cmd/validate-content built identity/team/role stores with no
           bundle layer and neither of repoAuthoritativeMode's two fatal
           repo-only guards. The bundle-root resolution and guard logic
           that lived inline in cmd/ethos/bundle.go and identity.go now
           lives once in internal/bundle (ResolveRoot, VerifyRepoOnly);
           both cmd/ethos and cmd/validate-content call it. Added a
           regression test (TestRun_RepoOnlyResolvesBundleTalent) proving
           an identity whose talent is supplied only by a repo-local active
           bundle now resolves under repo-only, plus a guard test
           (TestRun_RepoOnlyRejectsGlobalBundle) and a layered-mode
           no-regression test.

        2. Ext-completeness verification (internal/doctor.CheckRepoSetComplete,
           the same predicate `ethos vendor`/`ethos doctor` use) now runs as
           part of cmd/validate-content's own check list, so it executes on
           every push/PR through the existing CI step rather than nowhere.
           Confirmed clean (PASS) against this repo's current tree before
           committing.

        main() was refactored into a testable run(ethosRoot, globalRoot)
        (report, error) so the new logic is unit-testable without a
        subprocess.

        make check is clean except 3 pre-existing cmd/ethos export-test
        failures unrelated to this change (see evidence above) — confirmed
        via git stash that they fail identically on main with none of this
        mission's diff applied, caused by the shared main checkout's live
        (uncommitted) resolution:repo-only config, which this
        worktree-isolated agent cannot and should not touch.
