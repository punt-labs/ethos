context: Two related gaps found by code-reviewer on branch feat/vendor-repo-only, part of finishing the ethos-dsby repo-only migration cleanly. (1) validate-content's comment claims parity with cmd/ethos/identity.go's repoAuthoritativeMode but doesn't resolve the bundle layer (nil bundle store, empty bundleRoot everywhere) or carry its two fatal guards (no repo layer under repo-only; active bundle sourced from /Users/jfreeman). (2) nothing in CI actually verifies .vendor.yaml's ext-completeness claim (LayeredStore.WithRequiredExt/missingExt is never invoked by validate-content, and 'ethos doctor' — the one command that does check it — isn't wired into make check or .github/workflows/test.yml).
