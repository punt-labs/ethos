success_criteria:
    - 'THE RULE (dead simple): at SessionStart, a .claude/agents/<handle>.md is deleted IFF it carries the ethos provenance marker (agentmark.Has — first line == agentmark.Line) AND <handle> is not in the keep-set ethos owns this session. A file WITHOUT the marker is NEVER deleted — hard safety boundary. keep-set = plan.Owned (generated handles just written) ∪ deployed stub handles ∪ seeded checklist handles (code-reviewer, silent-failure-hunter, invariant-completeness-reviewer via the same source doctor uses, not a hardcoded duplicate).'
    - 'New file internal/hook/prune_agents.go: one exported func PruneOrphanedGeneratedAgents(checkoutRoot string, keep map[string]bool) ([]string, error). Glob checkoutRoot/.claude/agents/*.md; for each file whose base handle is not in keep, read it and os.Remove ONLY if agentmark.Has(content). Return deleted handles; accumulate (never fatal) unexpected errors; os.IsNotExist on the dir = nothing to prune. Fail-soft like the rest of SessionStart.'
    - 'Wire into HandleSessionStart (session_start.go) AFTER generation (installAgentDefsFor/plan write) and stub install, ONLY when the generator ran (deps.Teams!=nil && deps.Roles!=nil && planErr==nil) so a failed/partial plan deletes nothing (fail closed). Build keep-set from plan.Owned + deployed stub handles + checklist handles. Log ''ethos: session-start: pruned stale agent <h>.md'' per deletion to stderr.'
    - 'TDD, failing tests FIRST (record failing output in result). prune_agents_test.go: (a) marked file, handle NOT in keep -> deleted; (b) marked file, handle IN keep -> kept; (c) UNMARKED file, handle NOT in keep -> KEPT (the safety test, most important); (d) missing .claude/agents dir -> no error; (e) a remove/read error surfaces, not swallowed. session_start_test.go: a marked off-config agent present before HandleSessionStart is gone after, while an unmarked file and active-team files survive (drive the real HandleSessionStart path like the existing C1 tests).'
    - 'Reuse checklistAgentNames (doctor uses it over seed.Agents ''sidecar/agents''); if unexported, add a small shared accessor rather than duplicating the three names. Do NOT change the marker, the generator internals, or the stub installer — only ADD the post-generation prune. Verify: go build ./... clean; go test ./internal/hook/ ./internal/doctor/ green; go run ./cmd/validate-content passes. Keep internal/hook coverage at/above baseline.'
