        FINDING A: all three enumerated internal/mcp sites (mission_tools.go's bindDispatchedMission
        and clearClosedMissionBindings, tools.go's resolveSessionID) now distinguish
        resolve.ErrNotUnderClaudeCode (silent) from resolve.ErrNoSession (a warning naming the real
        cause via %w), mirroring the CLI counterparts fixed in round 2. clearClosedMissionBindings was
        the worst case: it returned nil (fully silent) for BOTH sentinels before this fix, so a closed
        mission's sidecar could be left in place with zero signal to the caller. Fixing this exposed a
        second, independent gap: internal/mcp/integration_test.go's TestMain was missing the
        resolve.UnderClaudeCode override every other package's TestMain already carries -- invisible
        pre-fix because both sentinel paths collapsed to the same message; once they diverged,
        TestHandleMission_CreateNoSessionInContextWarns failed with the loud message and a real
        ambient PID. Fixed alongside, same commit.

        FINDING C: cmd/ethos/iam.go's resolveSession contract comment rewritten to name all three
        outcomes (resolved / ErrNotUnderClaudeCode / ErrNoSession), replacing the stale claim that a
        nil error meant "genuinely no session" -- true pre-sentinel-commit, false after. Documentation
        only.

        FINDING D: retryReadCurrentSession now seeds lastErr from the caller's own initial read error
        instead of nil, so a zero-iteration retry loop still surfaces a non-nil error -- the err/id
        invariant now holds structurally, not merely at the shipped constant value of 10.
        pointerRetryAttempts/Delay converted from const to var so a test can drive the attempts count
        directly. New test drives pointerRetryAttempts=1 and asserts err is non-nil / id is empty;
        verified it fails to even COMPILE against the pre-fix code (a const cannot be reassigned) -- a
        stronger form of the required negative check than a runtime failure.

