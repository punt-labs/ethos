success_criteria:
    - 'FINDING B FIRST — it is the only one that returns a wrong answer today. internal/hook/subagent_start.go resolveParentLine is a SINGLE loop testing both the preferred and legacy keys against each participant in roster order, so a legacy-keyed participant appearing earlier WINS over a preferred-keyed one. Two reviewers proved it independently by running the real function: ''resolved parent handle = wrong-legacy'' when right-preferred was present in the roster, using 518779 — the shared daemon PID this whole decision exists to stop trusting.'
    - 'Fix B as a genuine two-pass, mirroring resolve.resolveFromSession and session.Store.JoinSelf which both already do it correctly: scan ALL participants for the preferred key to completion; only if that finds nothing, compute LegacyClaudePID() and scan again. The three sites must actually agree, because DES-074 already claims they do.'
    - Fix B's TEST. TestHandleSubagentStart_ParentLine_ToleratesLegacyKeyedPrimary builds a roster with NO preferred-keyed participant, so it proves the fallback fires and is structurally incapable of catching the inversion. Add a case with a roster where the legacy record PRECEDES the preferred one, and confirm it fails against the current single-pass code before you fix it. session.Store has a _PrefersNewKeyWhenBothPresent test — the sibling function needs its equivalent.
    - 'FINDING B-DOC: DES-074''s participant-keying amendment states all three read sites try preferred then legacy. That is currently FALSE for resolveParentLine. Correct the amendment text, or the record documents a rule the code does not implement — the exact failure that started this work.'
    - 'FINDING A: round 2''s class fix stopped at the CLI boundary. Three internal/mcp sites still collapse both sentinels — mission_tools.go:444 clearClosedMissionBindings (returns nil for both, so closing a mission via MCP can leave the sidecar and keep trailers stamping on a CLOSED mission), mission_tools.go:211 bindDispatchedMission (hardcodes ''no session in context'' so a corrupt pointer is reported as an absent session), and tools.go:481 resolveSessionID. Mirror the CLI counterparts, which already state the hazard in their own comments.'
    - 'The A class is FULLY ENUMERATED and these three are the last of it: cmd/ethos is closed, six indirect callers cannot observe the sentinel because resolveFromSession translates it, and nothing outside internal/mcp and cmd/ethos calls resolve.SessionID. Do not expand scope hunting for more — verify the enumeration holds, then close exactly these three.'
    - 'FINDING C: cmd/ethos/iam.go:82-83''s contract comment survived the round-3 sentinel commit unedited and now states the INVERSE of the truth — it says a nil error means ''genuinely no session'' when nil now means RESOLVED. Rewrite it to name all three outcomes, matching resolve.go''s own doc. A reader trusting this comment reproduces the bug at the next call site.'
    - 'FINDING D: the claim ''the invariant is now mechanical: err == nil if and only if id != empty'' (DESIGN.md and internal/resolve/resolve.go) is contingent, not mechanical. retryReadCurrentSession loops pointerRetryAttempts-1 times and lastErr is assigned only inside the loop, so at pointerRetryAttempts=1 it returns a nil error with an empty id and the three-outcome contract breaks silently. It holds today only because the constant is 10. Either make it structurally true regardless of the constant (preferred), or stop calling it mechanical and add a guard that fails loudly if the constant is ever set below 2.'
