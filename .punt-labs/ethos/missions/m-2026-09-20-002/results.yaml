      prose: |
        All three required fixes applied.

        Fix 1 (unwrap under-constraint): added dom unwrap = ran rsSeg to
        both the committed document and the two ethos-vaib scratch files.
        Re-ran every affected check. The whole-file model_check dropped
        from 29064/172720 to 7266/43180 -- exactly the state count the
        isolated Init/AdmitMission/ReleaseMission run already certified,
        confirming the prior inflation came entirely from the
        under-constrained unwrap witnesses and nothing else. The
