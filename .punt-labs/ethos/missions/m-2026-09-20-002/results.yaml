        rather than picking one; the vaib-fixed clean run is now stable at
        5 states, 9 transitions across both setsizes, down from the
        previously-inflated 20/36. Replaced open_question 1 with what the
        re-run actually shows, as instructed.

        Fix 2 (8ady mechanism): retargeted the citation to lint.go:193 and
        added witnessEntryIsDir, fixed to zfalse for the docs/** witness
        (matching strings.HasSuffix("docs/**", "/") = false in Go), as a
        leading conjunct of literalCovered. The guard now mirrors the real
        code's short-circuit exactly: literalCovered is unconditionally
        false for this witness because the trailing-slash check fails
        before HasPrefix would ever run, not because a per-segment string
        comparison was attempted and lost. Still deadlocks: 1 state, 5
        transitions, unchanged. Rewrote the surrounding prose and the
        Traceability table row to state this precisely rather than describe
        a literal comparison that never actually executes for this entry.

        Fix 3 (citation): conflict.go:360-378 -> 360-379 in both places it
        appeared.

