      open_questions:
        - The whole-file zspec model_check run (Store plus PathContainedByBuggy/Fixed together, 29064 states) is not reported certified complete by probcli, though raising the operation budget fivefold changed nothing; the isolated Init/AdmitMission/ReleaseMission run (7266 states) is certified complete with the same zero-violation result. Both are reported in the document. Evaluator may want to confirm this is an acceptable evidentiary basis for criterion (c) rather than requiring a certified-complete whole-file run.
        - 'Section Non-goals documents one deliberate, minor scope simplification in the admission model''s Store invariant: it applies the wildcard-aware position rule symmetrically to both entries being compared, which is marginally more permissive than entryPairConflicts''s literal-file-side reading in the single edge case of a file-shaped entry whose own segment text is itself the literal string ** — a combination no entry in this codebase exhibits. Flagging for evaluator awareness rather than treating it as a defect.'
      prose: |
        docs/spec-writeset-admission.tex models CanonicalPath and
        PathContainedBy as schemas (not free axdef functions) because a
        free function or relation whose domain mentions seq X, confirmed
        empirically before writing the committed model, makes probcli's
        SETUP_CONSTANTS fail for the whole file even when the operations
        under test never reference it. Paths are modelled as an
        absoluteness flag plus a segment sequence (RAWSEG/CanonicalPathFixed);
        write-set entries as segment patterns (PATSEG, ENTRY). The document
        states and checks the three required properties: (a) canonicalization
        preserves the absolute/relative distinction, exercised by the
        ethos-vaib decoupled demonstration; (b) containment is path-semantic
        rather than pattern-string-literal, exercised by the ethos-8ady
        decoupled demonstration; (c) open-mission write-sets do not overlap,
        modelled as Store's own invariant with AdmitMission's guard as its
        calculated precondition, checked clean by ProB.

        Both decoupled buggy-variant models reproduce their tickets as
        recorded ProB deadlock traces, following spec-mission-lifecycle.tex's
        errata technique exactly: neither is typed against ENTRY or Store,
        so the safety property is not baked into the type the buggy
        operation is checked against. ethos-vaib: 5 states, 21 transitions,
        deadlock at an absolute path admitted by a relative glob entry;
        corrected pairing, 20 states, 36 transitions, clean. ethos-8ady: 1
        state, 5 transitions, deadlock at a semantically-covered file the
        literal heuristic reports as uncovered; corrected pairing, 5 states,
        9 transitions, clean.

        The corrected admission model (Init, AdmitMission, ReleaseMission)
        runs clean in isolation: 7266 states, 35915 transitions, certified
        complete, zero violations. zspec check reports 0 errors on the
        committed file, confirmed independently by make check's own fuzz
        invocation over docs/*.tex.

        Commits: one commit for the whole document (single logical step —
        the model, its validation demonstrations, and its traceability
        table were designed and verified together and do not decompose
        into independently-reviewable slices without leaving intermediate
        commits fuzz-broken).
