success_criteria:
    - 'Copilot PR review finding (internal/ui/handlers.go ~line 160): handleMission loads the mission event log twice -- loadCorrections calls store.LoadCorrections which internally calls LoadEvents, then handleMission separately calls loadEvents which calls LoadEvents again. This duplicates disk I/O and JSON decode on every mission page view and can diverge if one load hits an intermittent read error and the other does not. Load events once and derive both the Events section and Corrections from that single event slice.'
    - 'Copilot PR review finding (internal/ui/handlers.go ~line 250): loadEvents discards the warnings slice returned by store.LoadEvents. A partially corrupt mission log (some JSONL lines failing to decode) renders as fully healthy even though LoadEvents already carries that integrity signal. Thread these warnings into missionData (e.g. EventsWarnings []string) and render them the same way the existing *Error warnings are rendered.'
    - 'Copilot PR review finding (internal/mission/correct.go ~line 263): Store.LoadCorrections drops the warnings returned by LoadEvents. If the mission log has decode warnings, a correction event could be skipped by LoadEvents with no indication the underlying log was partially unreadable. Either return warnings from LoadCorrections as well, or upgrade non-empty warnings to an error so correction consumers can surface the integrity signal -- pick whichever keeps LoadCorrections callers (CLI, MCP, UI) consistent with how they already handle LoadEvents warnings elsewhere in this codebase.'
    - 'These three findings are related: fixing the double-load (finding 1) naturally requires deciding how warnings flow from LoadEvents through both the Events path and the Corrections path, so implement all three together coherently rather than as three independent patches.'
    - make check passes, including make check-oo if present.
