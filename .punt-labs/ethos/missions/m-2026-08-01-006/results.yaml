      prose: |
        Finishes djb's three fail-open findings on PR #423. Four of the five
        files were already implemented and green in the worktree; the one
        remaining step was cmd/ethos/gitignore_local_ext_test.go, whose
        "legacy narrow rule" case still asserted the fail-open behavior.

        (1) LocalIgnored now probes a set spanning the canonical rule's
        breadth — .punt-labs/ethos/identities/probe.ext/probe.local.yaml,
        .punt-labs/vox/probe.local.md, .punt-labs/beadle/probe.local.json,
        and .punt-labs/probe.local.env — and reports coverage only when git
        excludes every one. The narrow .punt-labs/ethos/**/*.local.yaml now
        reads NOT covered, so the canonical rule is written.

        (2) Coverage is decided by `git check-ignore -v -z --no-index
        --stdin`, and a match counts only when its source travels with the
        repo: an absolute path (core.excludesFile) or anything under .git
        (info/exclude) is rejected, as is a negated pattern. When git cannot
        answer at all, covers() falls back to the literal line — the genuine
        no-git path, tested by TestLocalIgnoredFallsBackWhenGitCannotAnswer
        and TestLocalIgnoredOutsideAWorkTree.

        (3) doctor's trackedLocalExt scans :(glob).punt-labs/**/*.local.*
        (the shared enable.LocalIgnoreRule constant), so a tracked
        .punt-labs/vox/vox.local.md FAILs; coverage now calls
        enable.LocalIgnored, so doctor cannot report protected what setup and
        vendor would still write the rule into.

        Test change: removed "legacy narrow rule" from
        TestEnsureLocalExtIgnoredLeavesCoveredRepoAlone (canonical rule and
        whole subtree stay — they genuinely cover every probe) and added
        TestEnsureLocalExtIgnoredUpgradesNarrowRule, which asserts added=true,
        the narrow line preserved, exactly one canonical rule, LocalIgnored
        true afterward, and — the djb repro as an assertion — that `git add
        -A` on a repo holding .punt-labs/vox/vox.local.md and
        .punt-labs/beadle/creds.local.json stages only .gitignore. The repro
        was verified to have teeth: run standalone with only the narrow rule,
        git add -A stages both secrets.
