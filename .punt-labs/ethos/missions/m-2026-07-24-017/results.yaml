      prose: |
        FindRepoRoot returned the first .git ancestor; in a linked worktree .git is a
        file, so it returned the worktree cwd whose .punt-labs/ethos is empty (submodule)
        or absent, and identity/mission stores silently fell back to the global tree
        (ethos-yofr). Split the concern: FindRepoRoot stays work-tree-local for
        per-checkout state (enable/disable markers, .claude/agents, audit chunks); a new
        StoreRepoRoot resolves a .git file through the shared common dir to the main work
        tree that owns the store — git-first (git rev-parse --path-format=absolute
        --git-common-dir) with a manual gitdir/commondir fallback, the doctor/githook
        idiom. Routed every store locator through StoreRepoRoot: FindRepoEthosRoot
        (identity, talents, personalities, roles, teams, agents source, pipelines,
        validate-content), the mission contract store (missionStore/ForCreate, migrate,
        seal, resolveLeader), bundle+config resolution, find missions, and the
        SessionStart/PreCompact persona-config reads. ETHOS_REPO_ROOT overrides both
        resolvers. mission create/dispatch/claim warn loudly on global fallback instead
        of degrading silently. Docs updated in README + AGENTS; a worktree test creates a
        real linked worktree via git worktree add and asserts resolution.
