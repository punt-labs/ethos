    - 'State and model-check these invariants with ProB over a bounded instance (at least 3 sessions, 2 missions, 2 delegations): NoOrphanOpenSkeleton -- every open fork-propagated skeleton is named by a pending record or by a binding of an existing child; LineageStable -- a roster''s recorded parent never changes while the roster exists; NoLiveSessionPurged -- purge never removes a roster whose last-seen is within TTL or whose numeric participant is live; Acyclic -- the recorded parent relation has no cycle reachable by the ancestor walk, or the walk terminates on a visited set (state which). Each invariant either holds, or the counterexample ProB finds is recorded and the operation is amended in the spec until it holds.'
