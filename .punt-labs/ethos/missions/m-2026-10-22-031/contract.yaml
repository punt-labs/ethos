    - 'Extend docs/spec-opencode-integration.tex with a state model of the session lifecycle the DES-078 design (docs/design-opencode-plugin.md, rounds 6-7) specifies: roster existence, the write-once parent-session sidecar, the last-seen sidecar (written only on ensure --touch), ensure (first registration, refresh, lineage conflict, --parent-gone), session delete / deleteFiles (including the order of sidecar vs roster removal and a failed roster remove), purge via isStale (last-seen first when present; PID/TTL branch otherwise; read error; future-dated last-seen), and re-registration after deletion.'
