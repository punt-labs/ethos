      prose: |
        Resubmission against the corrected contract m-2026-10-14-022
        (write_set=docs/spec-opencode-integration.tex), replacing the
        escalated m-2026-10-14-013 whose write_set was mis-specified as
        .md. No rewrite was needed or performed: the worktree is unchanged
        since the escalation, confirmed via `git status`/`git diff --stat`
        immediately before this submission, and fuzz was re-run fresh
        (0 errors) to confirm nothing had drifted.

        docs/spec-opencode-integration.tex (1739 lines) is a harness-neutral
        Z specification of the OpenCode-to-ethos session/mission/delegation
        binding problem (bead ethos-5y4r). The Claude Code side is grounded
        in direct reads of internal/process/tree.go,
        internal/session/{session,store,match}.go, internal/resolve/resolve.go,
        internal/mission/active.go, and
        internal/hook/{pretooluse_dispatch,commit_trailers,audit_log}.go,
        cited by file and line throughout. The OpenCode side is grounded in
        a companion research artifact (docs/prfaq-opencode-integration.md,
        a sibling worktree) produced via context7 against anomalyco/opencode's
        dev branch across two evaluation rounds; this agent had no web-fetch
        tool of its own and attributes every OpenCode-specific claim to that
        artifact's own citations, disclosed explicitly in the spec's own
        Harness Instantiation section.

        The spec models: a HARNESS-tagged SESSION/DELEGATION/Registry state
        where no operation's guard or effect ever inspects the harness tag
        (HarnessNeutrality theorem); JoinRootSession and a dedicated
        ForkSession operation (OpenCode's session.fork, confirmed first-class
        and frequent, not a corner case); root/family as OpenCode's own
        context.data.session.root/.family lookups, modelled as a stored root
        field plus a family relation DERIVED from root equality (not stored
        per-session, to avoid the SETUP_CONSTANTS trap spec-writeset-admission.tex
        already documents for function-typed global constants); a dedicated
        AllocateDelegationForkPropagated operation whose traceability witness
        is family membership, distinct from the existing Claude Code
        parent_delegation inheritance path; and the five ethos-5y4r invariants
        as named theorems (DelegationIDFreshness, ForkNeverInheritsClaim,
        RestartClearsLiveness, WorktreeIndependence, FailClosedOnAmbiguity via
        a four-case ResolveCommitAttribution, plus a new
        TraceabilityViaRootSuffices theorem justifying the root-lookup design).

        fuzz type-checks the document with 0 errors. probcli at
        DEFAULT_SETSIZE 1 is CERTIFIED COMPLETE (287 states, 3862
        transitions, 0 violations, 0 deadlocks) -- the entire reachable space
        at that setsize, not a bounded sample; 16 of 18 operations fire, and
        the other two (ForkSession, AllocateDelegationForkPropagated)
        structurally cannot at setsize 1 (both require two distinct
        SESSIONID values), confirmed by their firing cleanly once setsize
        rises to 2. At setsize 2 the state space is considerably larger than
        either existing spec's own (373 and 5790 states respectively) and
        does not converge within the runs performed (up to 13,632 states,
        317,844 transitions, 0 violations, all 18 operations covered) -- this
        is disclosed, not hidden, in the spec's own Validation section, and
        flagged as follow-up diagnostic work for the evaluator or a
        subsequent revision.

        A mid-task pause-and-resume cycle occurred during drafting: the
        coordinator paused the original mission to commission additional
        OpenCode V2 research (the confirmed session.fork/
        context.data.session.{root,family,status} API, sourced via context7
        against anomalyco/opencode, two evaluation rounds) before the
        fork/lineage invariants were finalized. The resumed draft replaced a
        generic, first-draft PARENTLINK-walk design with the confirmed
        root/family lookup shape once that research landed -- recorded in
        the spec's own prose as the one genuine representational change
        between drafts.

        pdflatex compiles the document cleanly to a 22-page PDF (fixed one
        real LaTeX bug along the way: several \field{\dom ...} constructs
        nested a \mathop-defined Z macro inside \texttt{}'s text-mode
        argument, which fails even inside $...$ -- corrected by moving \dom/
        \seq outside \field{} throughout, matching the existing convention
        in spec-mission-lifecycle.tex).
