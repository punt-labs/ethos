        - name: 'Dogfood: fake HOME with a genuinely hand-edited implement.yaml (allow_empty_write_set flipped) — stays skipped (exists), doctor still FAILs, remedy names global (implement) with the seed-repairs-additive-gaps text'
          status: pass
      open_questions:
        - 'cmd/ethos/seed.go:99 prints every Result.Repaired entry as "repaired (was empty): %s" — outside this mission''s write_set, but that label is now inaccurate for an additive repair (the file was not empty). Flagged to the leader; recommend a one-line follow-up before v4.19.1 release messaging quotes seed''s own output.'
      prose: |
        Fix (1): decide()'s untracked/differing branch (the skip-if-exists
        category archetypes fall into) now tries additiveMerge before
        skipping. additiveMerge is textual: it parses both the on-disk file
        and the shipped content as top-level YAML mappings, requires every
        on-disk key to exist in the shipped content with an equal value (any
        conflict or user-only key aborts the merge), and if the shipped
        content defines keys the file lacks, appends each missing key's exact
        line range from the shipped file's own text to the end of the
        existing file, byte for byte. Existing lines are never rewritten, so
        a user's formatting/comments/quoting on shared keys survive
        untouched. The result lands in the existing Result.Repaired bucket
        and gets a manifest entry, per the contract's "reuse/extend the
        existing repaired mechanism" instruction — a later seed run sees it
        as tracked and no longer touches it via the repair path.

        Fix (2): CheckDelegatedWorkerArchetypes now buckets stale names by
        layer (LoadLayer only ever returns "global" or "repo-local") and
        appends a layer-specific remedy sentence: global names `ethos seed`
        as the real fix (true now, per fix 1); repo-local explicitly says
        seed never reaches it (ethos seed only ever writes
        ~/.punt-labs/ethos/ per cmd/ethos/seed.go) and names the actual
        repo-local archetypes directory to hand-edit or delete. All prior
        FAIL/PASS assertions in the existing test suite still hold verbatim.

        Verified live: a fake HOME with the exact pre-v4.19.0 archetype
        shape (implement.yaml/test.yaml missing require_delegated_worker)
        goes from a doctor FAIL with a no-op remedy to a doctor PASS after a
        single `ethos seed` run, with the field appended and nothing else in
        either file touched. A parallel fake HOME with a genuinely
        hand-edited implement.yaml (a real conflict, not just a missing
        field) correctly keeps its stale state and reports the accurate
        manual remedy — proving the fix does not silently overwrite real user
        edits.
