        - name: 'Dogfood: fake HOME reproducing GH #525 exactly — ethos seed repairs and appends the field with the truthful "repaired (missing fields added)" label, ethos doctor goes FAIL to PASS'
          status: pass
        - name: 'Dogfood: fake HOME with a genuinely conflicting implement.yaml — ethos seed prints "skipped (exists; beyond additive repair: conflicting value for key \"allow_empty_write_set\")", doctor still FAILs with the layer-correct remedy'
          status: pass
        - name: 'TestSeed_PrintsBucketsOnPartialFailure: a read-only roles dir makes every role file error while talents/personalities/etc. still succeed in the same run — stdout still reports the successful deployed: lines and the Seeded summary, not just the errors'
          status: pass
      prose: |
        Round 2 folds in the leader's requested label fix plus two silent-failure
        findings from local review, on top of round 1's two GH #525 fixes
        (additive-merge repair in internal/seed/decide, per-layer remedy text in
        CheckDelegatedWorkerArchetypes).

        Label fix: Result gained RepairedFields (additive-merge repairs) so
        Repaired keeps its original zero-byte-only meaning; cmd/ethos/seed.go
        prints each under its own truthful label ("repaired (was empty)" vs
        "repaired (missing fields added)"), folding both into the "N repaired"
        summary count. This was the smallest-truthful-option path that did not
        require touching TestSeed_RepairedLineOnStdout, which was outside the
        originally-widened write-set and pins the zero-byte label byte-for-byte.

        Finding 1 (decline reasons invisible): additiveMerge now returns
        (merged, reason, ok) instead of (merged, ok). reason is populated for
        every decline path — not a YAML mapping, decode failure, a local key the
        shipped content lacks (named), a conflicting shared value (key named),
        or "no missing keys explain the difference" — using a sorted key name
        when more than one local-only key exists, for deterministic output.
        decide()'s untracked/differing branch threads the reason into a new
        Result.SkipReasons map (dest -> reason), populated only when
        additiveMerge actually evaluated the file; cmd/ethos/seed.go's skip line
        checks the map and prints "skipped (exists; beyond additive repair:
        %s): %s" when present, the plain line otherwise (most skips are
        Markdown, never candidates for additive repair, and get no extra text).

        Finding 2 (buckets hidden on error): runSeed's error branch used to
        print only result.Errors and return, discarding every
        Deployed/Repaired/Updated line the same run had already written — no
        longer acceptable once seed mutates files in place. Bucket printing
        (extracted into a new printSeedResult helper) now runs unconditionally
        whenever result != nil, before the error check.

        All prior test assertions (TestCheckDelegatedWorkerArchetypes's FAIL/PASS
        substrings, TestSeed_RepairedLineOnStdout's exact zero-byte label,
        TestPlace_DecisionMatrix) hold verbatim; new tests cover both findings
        at the internal/seed unit level and the cmd/ethos CLI-output level.
