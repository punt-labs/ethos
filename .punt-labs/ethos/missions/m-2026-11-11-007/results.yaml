        Corrected all 8 findings (F2-F10) in internal/seed/sidecar/skills/optimize-team/SKILL.md against the real ethos source and the live built binary at <repo>/ethos. F7: every collaboration edge example now carries from/to/type, with a worked reports_to example matching the engineering/gstack/ foundation team YAML convention. F9: step 8 now runs `ethos vendor --team <t> --prune` (plan, no --apply) first, surfaces the plan via AskUserQuestion, and only runs `--apply --prune` on consent -- all --yes mentions removed. F4: step 7 now validates the staged closure with skill-owned checks (ValidateModel, edge type+tier, worker!=evaluator, slug resolution) before swap, then runs `ethos doctor` against the live result as confirmation, restoring the step-6 backup on any FAIL -- doctor is never pointed at a staged root, since it has no such argument. F5: optimize-in-place section now states plainly that pruning does not delete the generated agent file; doctor's "Orphaned agent files" check flags it and the user removes it by hand. F8: greenfield section now gathers the full proposal before ever invoking `ethos setup`, since setup persists identities and repo config immediately with no staging step. F6+F10: budget-estimate section now excludes the configured main agent (skipped by the generator) and adds the per-seat Write/Edit hook scaffolding bytes that buildAgentFile appends. F3: decision table rows 1-2 extended to "any primary language," with a note that "none" means no implementation surface at all, not "not Go or Python." F2: the identities bullet in step 6 states that a personality/ writing-style slug is a reference, not content, and must resolve or be staged; step 7's pre-swap validation now checks every proposed member's slugs resolve before cutover. Did not weaken the interview, decision table, tier ladder, budget method, or propose-then-ratify-then-write flow -- every edit either corrects a factual claim about ethos behavior or closes one of the eight named gaps.