      prose: |
        Generated specialist agents now carry a standing note naming their
        `tools:` field as the only authority on which tools exist. Claude Code
        injects every connected MCP server's instructions into a session, keyed
        to the server connection rather than the agent's allowlist, so a scoped
        specialist reads usage prose for tools it cannot call. The note lives in
        the agent's own system prompt, which outranks that ambient prose.

        buildAgentFile writes the block after the two opening identity lines and
        above the personality body — next to the frontmatter it refers to, and
        before any section that might name a tool. The examples in it stay
        generic (github, vox, "and others"): naming the full server list would
        date the note on every plugin change, and the rule does not depend on
        which servers happen to be connected.

        TestGenerateAgentFiles_ToolScopeNote asserts the note verbatim, asserts
        it sits between the reporting line and the first personality heading,
        and asserts it follows the frontmatter terminator.

        .claude/agents/ was regenerated by running `ethos hook session-start`
        from a .tmp/ build — no make install. All 27 files gained the same six
        lines and nothing else; the scratch session roster entry the hook run
        created was removed afterward.

