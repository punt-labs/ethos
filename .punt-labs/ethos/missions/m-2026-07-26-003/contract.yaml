success_criteria:
    - 'DESIGN ONLY (no code; write-set is docs). Produce docs/seed-content-upgrade.md + a DES ADR proposal block (for the leader to land in DESIGN.md) for making `ethos seed` propagate shipped content improvements to EXISTING installs without clobbering genuine user edits. Problem: the installer runs `ethos seed`, which skips any file that already exists ("skipped (exists)"), so a released improvement to a writing-style/personality/role/archetype/pipeline/bundle never reaches a returning user; only --force overwrites, and it does so blindly.'
    - 'Ground in actual code: read internal/seed/*.go (deploy/skip/writeFile, --force, embedded seed FS), the cmd/ethos seed command, and install.sh (how it invokes seed). Cite file:line for every current-behavior claim. Verify + state the scope fact: seed manages LIBRARY content only (roles, personalities, writing-styles, talents, archetypes, pipelines, bundles), never user identities (those are ethos setup''s).'
    - 'Core mechanism: a shipped-content manifest recording per seeded file the content hash of what each release shipped. On seed: (a) absent -> deploy; (b) present AND matches a known-shipped hash (unmodified) -> overwrite with new release version + record; (c) present but matches NO known-shipped hash (user-edited) -> skip + warn with a --force remedy. Specify manifest location, format, and how it is built/embedded at release.'
    - 'Solve the BOOTSTRAP/migration case explicitly (rsc scrutinize): an existing install upgrading for the first time has NO local manifest. To recognize an unmodified old file you must embed the set of KNOWN historical shipped hashes per file so an untouched pre-manifest file is upgraded while a hand-edited one is preserved. Design how the known-hash set is generated, embedded, and bounded per release. Give the exact decision table for {absent, matches-current, matches-older-shipped, matches-nothing} x {manifest present/absent}.'
    - 'Define --force under the new model, the installer change (switch to manifest-aware update, no --force), user-facing output (updated / skipped-local-edit / unchanged lines, DES-020 + CLI-standard tone), and a clean-machine dogfood plan proving: ship v1 -> install -> ship v2 -> re-seed updates the untouched file AND preserves a hand-edited file. List rejected alternatives with reasons and open questions for the leader/operator. Commit the design doc.'
