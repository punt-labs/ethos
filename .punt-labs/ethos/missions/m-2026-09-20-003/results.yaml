      prose: |
        Round 2 fixes both required defects from jra's review.

        1. SessionPurgeRefuse's citation named store.go:499-508 for the
        unsealed-lines refusal guard; those lines are actually inside
        PurgeTombstoned's unrelated roster-unreadable branch. Re-read
        purgeOneTombstoned directly and corrected the citation to
        store.go:634-669, the actual `if !force && (unsealed > 0 ||
        probeFailed)` guard, keeping 527-530 (the caller's didRefuse
        bookkeeping) as a supporting cite as jra allowed.

        2. Design 2 and Design 3's scratch models were missing
        CommitInWritingCheckoutNoHook (the hookInstalled=zfalse case, where a
        commit lands in the writer checkout but nothing seals because the
        pre-commit hook was removed by an earlier EthosDisable). That
        operation carries over unchanged from the current design in both
        variants and should have been included. Adding it to both scratch
        files raises their full-exploration transition counts from 66 to 70
        (Design 2) and 80 to 84 (Design 3), states unchanged at 17 -- matching
        jra's independent reproduction on two other probcli builds exactly.
        Added the same missing operation to Design 1 for consistency (38 to
        42 transitions); Design 1's unreachability conclusion is unaffected,
        since the added operation is a pure query.

        While reconciling Design 3, an unconstrained goal search for
        lostUnwarned=ztrue no longer reliably isolated the
        "SessionEnd-then-forced-removal" ordering from the
        "crash-then-later-SessionEnd" ordering, because both converge to the
        same final state (spooled=0, sealed=0, rosterKnown=zfalse,
        lostUnwarned=ztrue) via different paths, and goal search reports
        whichever path it happens to reach first -- exactly the instability
        jra's optional item 3 warned about. Replaced that row with a direct
        argument from WorktreeRemoveD3's guard shape (force? = ztrue or
        sealed = 0, a disjunction that stays satisfied under force?=ztrue
        regardless of sealed) rather than relying on an unstable trace to make
        the same point. Kept the "SessionEndD3 never ran" ordering as a
        ProB-confirmed table row (lostUnwarned=ztrue and rosterKnown=ztrue),
        which is a clean, path-unambiguous witness since only SessionEndD3
        ever clears rosterKnown.

        Added the optional item 3 caveat: full-exploration ProB counts are
        deterministic (same 17/78 on rerun of the committed file); the
        current-design goal-search count itself moved from 7/35 (round 1) to
        6/37 (round 2 rerun of the unmodified operations), demonstrating in
        this document's own numbers that goal-search counts are search-order
        artifacts and reachability (TRUE, with a trace) is the load-bearing
        claim, not the count.

