      prose: |
        docs/spec-audit-durability.tex models an audit line's life (spooled,
        sealed, committed) across the six named actors: commit in the writing
        checkout, commit in a sibling worktree, git worktree remove, session
        end, ethos disable, and session purge. Every operation cites file:line
        in internal/hook/audit_seal.go, audit_vacuum.go, session_end.go, and
        internal/session/store.go.

        The safety property, AuditDurability, is deliberately not baked into
        the AuditLine state schema's own invariant, following the errata
        already on record in spec-mission-lifecycle.tex's Validation section:
        doing so would make any operation that violates it unsatisfiable
        rather than caught, which is a false negative, not a clean result.
        Reachability is instead confirmed directly with probcli's goal search
        (-model_check -goal "<predicate>" -check_goal), which halts and prints
        a real trace the first time it finds a matching state.

        On the committed file, that search confirms the ethos-015a loss state
        is reachable in one step: WorktreeRemove destroys two spooled lines
        with no seal and no warning, because no ethos hook fires on git
        worktree remove at all (confirmed absent by inspecting internal/resolve,
        which only reads worktree layout).

        Three candidate designs were each built as an independent scratch .tex
        file (per spec-mission-lifecycle.tex's own decoupled-variant technique,
        to avoid redeclaring the state schema and to keep each variant's own
        invariant from absorbing its own buggy transition), type-checked and
        model-checked directly with probcli, and their Z source and results
        transcribed into the committed document as illustrative verbatim plus a
        results table:

          - Design 1, per-machine spool: unconditionally safe. Full exploration
            of all 9 reachable states finds no violation in any ordering.
          - Design 2, worktree-aware seal: only safe when a sibling checkout
            commits before the writer checkout is removed; a bare removal with
            no other commit pending still reaches the loss state.
          - Design 3, sealing SessionEnd: only safe when SessionEnd actually
            ran and the operator does not pass --force to git worktree remove;
            both the crash/never-ended ordering and the deliberate-force
            ordering still reach the loss state.

        The verdict section recommends Design 1 (bead ethos-ss2x, a per-machine
        SQLite spool) as the fix, with Design 3 worth adding afterward as cheap
        defense in depth for the ordering it does close.

        make check passes (golangci-lint, shellcheck, e2e pytest, markdownlint,
        go test -race across all packages, validate-content, and fuzz on all
        four .tex specs in docs/ including this one). Only
        docs/spec-audit-durability.tex was touched; committed as 2faef55.
