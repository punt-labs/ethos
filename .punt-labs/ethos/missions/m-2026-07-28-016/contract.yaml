    - 'Fix the committed-PII cluster: ethos-ersr + ethos-n4np (same bug) and ethos-ggtu. All three are ''sensitive content reaches git-tracked shared history because the write-path redaction is incomplete.'' Read docs/audited-delegation.md (§Path redaction) and DESIGN.md DES-054/DES-058 first. Redaction must be FAIL-SAFE throughout (djb lens): a redactor error must never fall through to writing the unredacted content — fail closed (skip/refuse or redact-or-error), never leak.'
    - 'ersr + n4np (one fix, closes both): the Tier B delegation-record writer captures prompt.md and record.yaml (and result.md if present) with absolute $HOME/<repoRoot> paths intact — a username + filesystem-layout leak into a public repo. Route that content through the SAME path redactor the audit lines already use ($HOME -> ~, <repoRoot> -> <repo>) BEFORE write. The write happens at the PreToolUse-on-Agent skeleton/prompt capture (internal/hook/pretooluse_dispatch.go) and the delegation-record writer (internal/mission — delegation.go/store.go/binding.go). Apply the existing redactor (internal/hook/audit_entry.go) — do not reimplement it.'
    - 'ggtu: the audit write-path redaction rewrites HOME/repoRoot PATHS only, so message CONTENT and addresses pass through to the sealed git-tracked record (observed: a full send_email body + recipient, and a recipient email inside a CronCreate prompt, committed to a public repo). Add a per-tool content-redaction policy at the audit write path (internal/hook/audit_entry.go / audit_writer.go): for send_email tool_input, reduce to {subject, to: redacted, body: redacted} (or a hash of body); add a configurable PII pattern pass (email addresses at minimum) over prompt-bearing inputs (e.g. the CronCreate prompt). CRITICAL ORDERING: apply all redaction BEFORE computing tool_input_hash, so tool_input_hash stays consistent with the stored form and the cross-machine collision-detection invariant (DES-054) holds. Preserve the redacted:true marker convention where the existing hand-redacted lines use it.'
    - 'Do NOT weaken existing behavior: non-sensitive tools'' audit lines and the current HOME/repoRoot path redaction stay byte-identical; the hash is still computed over the redacted form (never the raw form). The redaction lint/policy is djb-owned — mirror the credential-guard discipline (name/pattern-based, fail-closed).'
    - 'Tests: (a) a delegation prompt.md/record.yaml containing an absolute /Users/... path is written with ~ (no absolute $HOME path reaches disk); (b) a send_email audit line stores subject + redacted to/body and tool_input_hash matches the REDACTED form (not the raw); (c) a CronCreate prompt containing an email address is PII-redacted before write; (d) a non-sensitive tool (Read/Edit) audit line is unchanged. Table-driven.'
    - make check green before EVERY commit (golangci-lint + go test -race + validate-content; `make tools` if golangci-lint missing). Commit incrementally (delegation-record path redaction; then the per-tool audit content policy). Stay within the write-set. CHANGELOG [Unreleased] Fixed entry citing ethos-ersr / ethos-n4np / ethos-ggtu. No suppressions. GH_TOKEN valid (claude-puntlabs), no env -u. When done, PR to punt-labs/ethos base main, request Copilot review once, report the PR number to the leader. Do NOT merge.
