        - Write-set extension needed for internal/hook/session_start.go. It still calls Create, so SessionStart-written rosters record an empty Checkout and the checkout-scoping half of Fix 2 stays inert for them. Fix 1 removes the false positives regardless. Edit is a ResolveCheckout() helper beside ResolveRepo()/ResolveHost() (session_start.go:272-294) plus switching line 176 to CreateInCheckout.
