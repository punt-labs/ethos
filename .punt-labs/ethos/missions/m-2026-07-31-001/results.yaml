      prose: |
        The vacuum cross-check compared a git-tracked fact against a gitignored
        file. Sealed chunks travel between checkouts; the live zone is per-checkout
        by design (DES-058). Warning on file absence alone therefore reported loss
        for every mission a long-lived session had touched, in every checkout that
        had not written the log. No audit data was ever lost.

        Fix 1 makes the predicate MissionLive.Lost — absent AND unsealed AND no
        frozen legacy record — so a sealed chunk is taken as proof of survival.
        Fix 3 folds in the pre-DES-058 log.jsonl. Fix 2 implements the design's
        already-stated "path retained in the vacuum cross-check": session.Roster
        gains Checkout as a peer of Repo, and the live probes follow it while
        tracked-chunk probes stay at the committing checkout. Fix 4 applies the
        same predicate to the session purge guard, which could otherwise mint a
        permanent flagged loss tombstone for a session that lost nothing, and makes
        the tombstone branch honor Tombstone.Checkout.

        Store.Create keeps its signature and delegates to a new CreateInCheckout.
        That choice shrank the out-of-write-set blast radius from eight files to
        one, at the cost of a second constructor.
