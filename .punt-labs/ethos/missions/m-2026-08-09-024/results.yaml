        - 'docs/design-delegation-lifecycle.md (finding #5) is also outside this mission''s write_set -- the leader''s task did not flag it, but the contract''s write_set does not list it either. Committed separately (3589178), same disclosure treatment as finding #1.'
        - 'Finding #7 (Store.Abandon has the same countDelegations-vs-concurrent- dispatch race class facet 1 closed for Close, at store.go:1222) was explicitly scoped out of this round by the leader''s instruction. Not touched. Recommend a follow-up bead: Abandon''s countDelegations walks delegations/ without the exclusive lock that Close now takes, so a concurrent dispatchTierB can still write a skeleton after countDelegations returns zero, producing verdict: open under StatusAbandoned.'
      prose: |
        Six findings from the round-1 local review (code-reviewer,
        silent-failure-hunter, invariant-completeness-reviewer running in
        parallel), fixed in order, one commit per finding, make check green at
        every commit.

        1. formatMissionCreate never rendered the top-level `warnings` field
           handleCreateMission populates on a sidecar rebind (ethos-5jsf) -- every
           rebind notice reached JSON but no rendered surface. Mirrored
           formatMissionShow's handling: extract warnings, call
           writeMissionWarnings before emit. New test:
           TestFormatOutput_Mission_Create_Warnings. Outside the mission's
           write_set -- committed separately (00fdb15), disclosed above.

        2 and 3 (same code block, one commit, 2098d80). Store.Close's
        delegation-sweep gate had two related silent-failure gaps:
        - A lock-acquire failure on AcquireMissionLockExclusive skipped the sweep
          outright -- the exact bug this round's mechanism exists to close, via a
          new path. Now falls back to the pre-fix unlocked sweep with a stderr
          warning naming the residual TOCTOU risk.
        - The stat check deciding whether to skip locking used a bare "err !=
          nil" test, so EACCES/EIO/ELOOP all took the unlocked bare path meant
          only for a legitimately-absent directory. Extracted as
          missingRepoTreeDir(statErr) -- only os.IsNotExist satisfies it; every
          other stat error now falls through to attempt the lock (and, on lock
          failure, fix 2's fallback).
        New tests: TestMissingRepoTreeDir (table-driven: nil, ENOENT, wrapped
        ENOENT, EACCES, EIO, ELOOP, arbitrary error) and
        TestStore_Close_LockFailureFallsBackToUnlockedSweep (synthetic
        lock-acquire failure via a directory pre-occupying the lock file's path;
        confirms the delegation still closes and the exact warning text fires).

        4. dispatchTierB's TOCTOU re-check used `if recheck, err :=
           store.Load(missionID); err == nil { ... }` -- a re-check Load error
           silently fell through to WriteDelegationSkeleton, asymmetric with the
           first Load (which blocks on error). Neither Load failing is evidence
           the mission is open; only a successful Load reporting status: open is.
           Now a re-check failure warns (session, mission, error) and falls
           through to Tier A/B fallback, same as the non-open case. New test:
           TestDispatchAgent_EnvMissionIDStatusRecheck_LoadErrorFallsThrough --
           blocks dispatch on AcquireMissionLock via a held exclusive lock
           (mirroring the existing TOCTOU test), deletes the on-disk contract
           while dispatch is blocked so the re-check Load fails with a real read
           error, asserts the spawn falls through with no delegation record
           written.

        5. docs/design-delegation-lifecycle.md's Summary and Facet 1
           Recommendation overstated the guarantee as "nothing can be written to
           a closed mission's delegations/ directory after this fix ships." The
           code actually guarantees a weaker but audit-adequate invariant: no
           open-verdict delegation record persists under a closed mission, via a
           write-either-refuses-or-is-swept pairing (the narrow window where
           dispatch already holds the shared lock when Close starts its
           exclusive-lock acquisition lets a skeleton briefly land, but Close's
           own subsequent sweep catches it). Reworded both spots. Docs-only, no
           code change. Outside the write_set -- committed separately (3589178),
           disclosed above.

        6. acquireMissionLock's release closure discarded LOCK_UN and Close
           errors with "_ =". This path now backs the exclusive-lock sweep used
           by Store.Close inside long-lived MCP-server processes -- a leaked
           flock or fd hangs every subsequent AcquireMissionLock/
           AcquireMissionLockExclusive on that mission until the process
           restarts, with no operator-visible signal. Now logs both failures to
           stderr. No dedicated failure-injection test: the release closure does
           not expose the underlying *os.File to a test, so there is no seam to
           force LOCK_UN or Close to fail without reaching into unexported state;
           the existing acquire/release unit tests continue to cover the success
           path.

        Every commit passed `make check` (go vet, staticcheck, shellcheck,
        markdownlint, go test -race -count=1 ./..., validate-content) before the
        next commit started. Six commits total (fix 2+3 share one commit since
        they touch the same code block), matching the mission's commit-per-step
        criterion.
