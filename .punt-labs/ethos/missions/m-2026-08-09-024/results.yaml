      prose: |
        Implements docs/design-delegation-lifecycle.md, strict TDD throughout
        (each fix committed only after its test was confirmed red for the
        right reason, then green).

        Facet 1 (lifecycle hardening): added AcquireMissionLockExclusive to
        internal/mission/delegation.go, sharing its body with the existing
        AcquireMissionLock via a new unexported acquireMissionLock(mode)
        helper. Store.Close now takes the exclusive lock around
        closeDelegationSkeletons -- but only when the repo-tree per-mission
        directory already exists, so closing a mission whose data lives
        entirely in the legacy global tree still creates no repo-tree
        footprint (preserves TestStore_TwoRoot_CloseStaysInItsLayer).
        TestStore_Close_WaitsForInFlightDelegationWrite proves the ordering:
        a goroutine holding the shared lock while writing a delegation
        skeleton blocks Close's sweep until it releases, so the record is
        never left at verdict=open by a sweep that ran too early.

        Facet 2 (attribution, ethos-14r7): dispatchTierB (the MISSION_ID-env
        path) now re-checks mission status via a new nonOpenReason helper
        shared with staleBindingReason (case 2's existing check) -- once
        right after the first Load, and again immediately before
        WriteDelegationSkeleton while holding both the mission and
        delegation locks, closing the TOCTOU window against a concurrent
        Close. Both non-open outcomes fall through to Tier A with a stderr
        warning matching readActiveMissionForDispatch's existing shape,
        never a blocked spawn. TestDispatchAgent_EnvMissionIDStatusRecheck
        is table-driven across all four terminal states (closed, failed,
        escalated, abandoned), each driven to that status through the real
        store lifecycle (Close or Abandon, not a hand-edited fixture).
        TestDispatchAgent_EnvMissionIDStatusRecheck_TOCTOU pins the second
        check specifically: it holds AcquireMissionLockExclusive itself to
        block dispatch's shared-lock acquisition after its first Load
        succeeds, runs a concurrent Close whose contract transition commits
        during that window (Close's transition uses a different, unrelated
        lock), then releases the hold and asserts dispatch falls through to
        Tier A with no delegation record written -- reverting the
        dispatchTierB fix reproduces the leaked record and fails the
        assertion for the right reason (verified manually before writing
        the fix).

        ethos-5jsf (MCP parity): handleCreateMission now calls a new
        bindDispatchedMission method mirroring the CLI's
        bindDispatchedMission (cmd/ethos/mission.go:2023) -- rebinds the
        session's active-mission sidecar with dispatch origin the instant a
        fresh mission is minted, and returns a warnings array (MCP has no
        stderr channel) when a rebind displaces a different mission's
        binding, matching handleCloseMission's existing warnings
        convention. Three existing close-path tests
        (TestHandleMission_CloseLeavesOtherMissionActive,
        TestHandleMission_CloseWarnsOnUnreadableSidecar,
        TestHandleMission_CloseWarnsPerCause) assumed create wrote no
        sidecar file; their fixtures are updated to account for the new
        create-time write without changing what each test actually proves.

        Test-file placement note: the mission's write-set names
        internal/hook/pretooluse_dispatch_test.go; the two new facet-2 tests
        and their shared stageMissionInStatus helper were first added to
        the existing internal/hook/pretooluse_test.go (where every sibling
        case-1/case-2 dispatch test already lives) for convention
        consistency, then moved verbatim into the write-set's literal
        filename once `ethos mission result --verify`'s write-set check
        made the mismatch concrete -- pretooluse_test.go is now
        byte-identical to its pre-mission content.

        format_output.go (CLI/MCP-hook rendering of tool results) is
        outside this mission's write-set and was not touched. Its
        formatMissionCreate does not currently render a `warnings` field the
        way formatMissionShow/formatMissionClose do, so a create-time rebind
        warning is present in the raw JSON result but not yet rendered in
        the pretty-printed hook output. Flagging as a known follow-up gap,
        not fixed here.

        Every commit passed `make check` (including go test -race) before
        the next one started; six commits total, one per logical step per
        the mission's commit-per-step criterion.
