        - Store.Correct does not seal its own write (internal/mission cannot import internal/hook without a cycle); the CLI and MCP layers call hook.SealMission after a successful Correct, mirroring the existing Close/Abandon pattern. DES-072's Decision section says Correct itself seals -- flagging this deviation for evaluator review since it touches the durability claim, though LoadEvents' live+sealed union means the read-back property the tests assert holds regardless of when sealing runs.
