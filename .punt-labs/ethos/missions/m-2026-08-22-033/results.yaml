      prose: |
        Implemented DES-072 end to end across all six write-set areas:
        internal/mission (Correct, Correction, ValidateCorrectionAuthor,
        DecodeCorrectionStrict, LoadCorrections), the CLI (mission correct,
        plus show/results/log rendering), the MCP mission tool (correct verb
        + DES-020 formatter), ethos ui's mission detail view, and the doctor
        hand-edit check. Six commits, each passing make check.

        Two deliberate deviations from the literal DES-072 text, both
        documented in code comments and called out in open_questions above:
        (1) sealing happens at the CLI/MCP layer, not inside Store.Correct,
        because internal/mission cannot import internal/hook without a
        build cycle (hook already imports mission); (2) the doctor check
        parses YAML structurally instead of using a bare `^\s*#` regex,
        because the regex produces a real false positive against this
        repo's own tracked mission data.

        All 7 tests DES-072's Verification section names are present with
        those exact names (in internal/mission/correct_test.go and
        internal/doctor/hand_edit_test.go, per the mission's write-set --
        not store_test.go, which is outside the write-set). Added
        substantial additional coverage beyond the named 7 (author
        resolution, decode strictness, terminal-status parity, block-scalar
        false-positive regression, CLI/MCP/UI rendering round-trips).

        docs/spec-mission-lifecycle.tex was not touched, per the mission's
        explicit out-of-scope instruction.
