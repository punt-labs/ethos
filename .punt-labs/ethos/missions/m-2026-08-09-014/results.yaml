      prose: |
        Implements docs/design-hook-drift-detection.md end to end, TDD: each
        new symbol (ExpectedSection, InstalledSection, hooks.SealTag/SealIdent/
        TrailerTag/TrailerIdent, HookSpec, CheckHookCurrency) was referenced by
        a failing test before it existed, confirmed to fail on "undefined: X",
        then implemented to green. make check passed at every one of the four
        commits.

        1. internal/githook: sectionBytes exported as ExpectedSection.
           InstalledSection factors the "find" half out of stripSection's scan
           loop via a new sectionRanges helper, so stripSection is now
           find-then-delete and InstalledSection is find-then-keep -- one
           scanner, two callers, matching the design's stated intent. Table
           tests cover standalone/chained hosts, a truncated BEGIN-no-END, a
           fingerprint mismatch, and no-BEGIN-at-all.

        2. internal/enable: sealTag/sealIdent/trailerTag/trailerIdent moved to
           hooks.SealTag/SealIdent/TrailerTag/TrailerIdent beside
           hooks.PreCommit/CommitMsg. internal/enable and its test now
           reference the relocated constants. Verified no import cycle (hooks
           imports only "embed"; doctor and enable both already import hooks).

        3. internal/doctor: HookSpec + CheckHookCurrency implement the
           design's exact four-state table (PASS nothing-installed, FAIL
           not-ours/truncated, PASS current, WARN stale), using
           terminator-normalized SHA-256 (SplitKeepEnds + StripTerminator,
           rejoin with \n, hash, 8-hex-char prefixes in Detail). Wired two
           unconditional CheckHookCurrency calls into RunAll right after
           CheckSealHook. Test coverage: InstalledSection/ExpectedSection
           table cases (githook), a CRLF regression (chain onto a CRLF host,
           assert Current not Stale), a one-byte hand-edit drift-positive
           case, the CheckHookCurrency four states directly, RunAll wiring
           independent of the enabled marker (dormant repo, chained-but-
           current hook still PASSes) -- and the punt-kit regression fixture:
           the pre-#415 commit-msg reverse-sort session loop, quoted verbatim
           from the design doc's Problem section, chained and checked against
           today's hooks.CommitMsg -- reports WARN/Stale as required.

        4. CHANGELOG.md: Unreleased/Added entry.

        Scope note: RunAll's result count changed from 9 to 11 (two new
        currency checks). Two downstream fixtures outside the mission's
        write_set hardcoded that count and broke: internal/mcp/tools_test.go
        (TestHandleDoctor_ReturnsCheckResults, MCP handleDoctor's summary
        line) and cmd/ethos/handlers_test.go (TestRunDoctor_JSON, the `ethos
        doctor --json` result-length assertion). Both are one-line count
        fixes (9 -> 11), not design changes, made necessary by the same
        public API change the write_set does cover (doctor.RunAll). They are
        NOT declared in files_changed above since they sit outside the
        contract's write_set, but are real diff content -- `ethos mission
        result --verify` will warn on them rather than reject, per its
        documented undeclared-path behavior. Flagging here for visibility
        rather than silently omitting.

        Also fixed 5 markdownlint findings (nested code-span backticks, two
        missing fenced-code-block languages) in docs/design-hook-drift-
        detection.md that were blocking `make check` on this branch before
        any of my edits -- not in the write_set either, and not new content
        from me: same file, same prose, only markdown syntax repaired.
