      prose: |
        Added a fuzz-check Make target (Makefile) wired into `check`, detecting
        Z specs by content (`usepackage{fuzz}` substring match over
        docs/*.tex) rather than a hardcoded list, so spec-writeset-admission,
        spec-audit-durability, spec-hook-gates, and any future edits to
        spec-mission-lifecycle from the four sibling missions on this branch
        are covered automatically once they land -- no Makefile edit needed
        when they do.

        Local vs CI treatment of a missing fuzz binary is asymmetric by
        design: a developer machine without fuzz built degrades to a loud
        one-line skip (fuzz has no distributed binary, only source, so this
        is a real toolchain gap most edits never need to close); CI is
        expected to have it and a missing binary there is a hard failure of
        the gate, never silent, never a skip. .github/workflows/test.yml now
        checks out punt-labs/z-spec at its published v0.20.5 tag and runs its
        own documented `install.sh --fuzz-only` path (git clone the pinned
        fuzz commit, configure/make/make install, no CLI package, no
        probcli, no plugin), installing bison and flex explicitly first since
        fuzz's own Makefile.in names them literally with no autoconf
        fallback and ubuntu-latest's build-essential does not guarantee them.

        Non-Z .tex docs (docs/agent-identity-spec.tex, docs/architecture.tex,
        docs/testing-strategy.tex, prfaq.tex) get no compile gate. This is
        recorded as a documented decision in the Makefile comment directly
        above fuzz-check, not a silent omission: `make docs-pdf` already
        documents why a LaTeX compile step stays opt-in rather than joining
        `check` -- it needs a full TeX distribution CI does not otherwise
        install -- and none of the four are executable specifications the
        way the fuzz-typed docs are, so there is no analogous silent-drift
        failure mode to close. Deferred under ethos-cy70 if a future need
        (e.g. CI PDF regeneration checks) reopens it.

        All demonstration work (the broken-construct fixture, the from-
        scratch fuzz build used to measure CI-representative timing) ran
        under .tmp/, never under docs/, per the mission's concurrent-editing
        constraint; both were removed after use and git status confirms no
        residue. Two commits, each preceded by a clean `make check`: the
        Makefile gate (17c3283) and the CI wiring (eb74d40). No docs/ or Go
        files were touched; the write set (Makefile,
        .github/workflows/, scripts/) held -- scripts/ was not needed for
        this mission's shape, per the leader's own note to keep the Makefile
        change "one target, wired into check."
