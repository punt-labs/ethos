context: |
    Fixes ethos-vqwn (P1). Ethos resolves "which session is calling me" by
    walking the process tree to the TOPMOST claude ancestor and using that PID
    as the key into sessions/current/<pid>. Measured 2026-09-07 on okinos: the
    topmost claude ancestor is `claude daemon run`, which every concurrent
    Claude Code session on the host shares. Six rosters across four repos all
    list PID 518779. Three pointer files serve all of them. Each SessionStart
    overwrites the same file; last writer wins. A shell in punt-labs/ethos
    resolved to a punt-labs/z-spec session. Consequence: a commit in one repo
    can carry another repo's Mission:/Delegation: trailers — the DES-054 audit
    chain can lie, not merely go missing.

    This is a copied defect. A sweep of all 23 sibling DESIGN.md files found
    the same walk in ethos, mcp-proxy and lux, propagated by citation rather
    than re-derivation. biff already fixed it (DES-058, 2026-08-22) and the fix
    never propagated. Read biff's DES-058 in full before starting:
    /home/jfreeman/Coding/punt-labs/biff/DESIGN.md:6627-6783. It contains the
    mechanism you are porting, the two alternatives that were tried and failed,
    and the test names to model yours on.

    Operator ruling 2026-09-07 governs the error handling: a mechanism is
    reliable or it raises a clear error with a hint. Solutions that work 90% of
    the time and misattribute the other 10% cause more churn than solutions
    that stop. Agents here routinely work across worktrees and sibling repos —
    exactly the condition under which a quiet fallback misfires. Every silent
    fallback in this path becomes a named error.
