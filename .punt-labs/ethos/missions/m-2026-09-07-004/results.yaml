      prose: |
        Addresses every item from the team-lead's direct message (participant
        keying: JoinSelf + LegacyClaudePID fallback across all 4
        participant/agent sites, doubled error prefix, commit-trailers silent
        stderr) plus the formal round 2 reflection's R1-R6:

        R1/R1b: WriteCurrentSession now writes via temp+rename (matching
        writeRoster's existing discipline) instead of a direct truncating
        os.WriteFile; ReadCurrentSession treats a blank result as an error
        instead of a successful empty session id. Closes the reintroduced
        silent-wrong-answer window a non-atomic write opened.

        R2/R2b: resolveHumanIdentity no longer consults the session store at
        all (resolve.Resolve(store, nil)) -- a session-based lookup at
        SessionStart is a structural, guaranteed miss (nothing can exist yet
        for the invocation that would create it), not a signal, and was only
        ever silently free before this decision made misses expensive. Removes
        the ~450ms retry and the identity-degrades-to-OS-username regression on
        every fresh session. R2b needed no separate fix -- nothing loud is
        produced at this site anymore for session-start.sh's `|| true` wrapper
        to swallow.

        R3 (binding ruling applied verbatim): resolveFromSession now returns
        silently on a participant miss (roster loaded, no participant matches
        this caller) -- only a session that itself fails to identify or load
        stays loud. Also corrected the "distinct per nesting level" claim in
        DES-074's Decision section per the subagent-inheritance measurement.

        R4: added direct loud-branch tests in cmd/ethos
        (TestRunWhoami_LoudWhenSessionUnresolvableUnderClaudeCode,
        TestBindDispatchedMission_ReportsUnresolvableSessionUnderClaudeCode,
        fixed TestMissionClaim_RefusesWithoutSession_Subprocess's own escape
        hatch gap) that explicitly force resolve.UnderClaudeCode=true rather
        than relying on each package's blanket TestMain override plus a test
        that does not actually care which branch fires.

        R5: resolveSession no longer collapses resolve.ErrNoSession into the
        local errNoSession sentinel -- bindDispatchedMission and
        clearClosedSessionBindings's own errors.Is(err, errNoSession) checks
        now correctly distinguish "no session at all" (silent, advisory) from
        "a session was expected but unresolvable" (now reported).

        R6: SessionID wraps retryReadCurrentSession's real accumulated error
        into the returned error instead of discarding it for the bare
        ErrNoSession sentinel; errors.Is(err, ErrNoSession) is preserved via %w.

        `make check` passes clean throughout (re-run after every logical
        change, per the mission contract's incremental-commit requirement). No
        suppressions added. 8 commits this round, each green before the next.
