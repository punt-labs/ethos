      open_questions:
        - 'files_changed lists only the write_set-scoped files. Changing resolve.SessionID''s return arity (2 values -> 3, required by the contract''s own success criteria) forced a mechanical, behavior-preserving update at 5 call sites outside the nominal write_set to keep the build green: cmd/ethos/hook.go, cmd/ethos/mission.go (each one line, discard the new error the same way the old empty string was discarded), internal/mcp/mission_tools.go and internal/mcp/tools.go''s sibling file internal/mcp/integration_test.go (test env fixture needed the same UnderClaudeCode-ancestor-walk test-isolation fix internal/mcp/tools.go itself needed), and internal/doctor/doctor_test.go (same test-isolation fix, doctor''s CheckHumanIdentity calls resolve.Resolve directly). All five are committed on this branch; none is a design decision, all are reported for visibility since they sit outside write_set.'
        - DESIGN.md's silent-vs-loud split (amendment 120ca67) makes an explicitly-set ETHOS_SESSION that does not check out (nonexistent or corrupt roster) loud on EVERY consumer, including `whoami` -- previously whoami was the one 'soft' exception (warn + fall back to git/OS). I judged this a deliberate, in-scope consequence of the amendment (an ended/corrupt explicit session is exactly one of the three wrong-answer cases DES-074 measures) and updated TestCLI_Session_NonexistentRoster and TestCLI_Whoami_WarnsOnCorruptRoster accordingly rather than adding a whoami-specific carve-out. Flagging for evaluator confirmation since it changes an observable CLI contract beyond the pointer-file mechanism itself.
        - 'Added two things DESIGN.md does not mention: resolve.UnderClaudeCode (a package-variable indirection over process.UnderClaudeCode) and process.ForceNotUnderClaudeCodeEnv (a negative-only env escape hatch). Both exist solely so this suite''s own tests can deterministically exercise ''not running under Claude Code at all'' despite this repo being developed AND tested from inside a live Claude Code session, where a spawned test binary''s real process ancestry always includes a genuine claude ancestor -- env-var stripping alone cannot defeat UnderClaudeCode''s third (ancestor-walk) signal for a subprocess test. ForceNotUnderClaudeCodeEnv can only force UnderClaudeCode to false, never true, so it cannot fabricate a session; it is applied at cmd/ethos''s runCLI (one choke point for the whole package) and internal/mcp''s setupMCPTestEnv. Flagging as a deliberate, testability-driven addition outside DES-074''s literal text.'
      prose: |
        Implements DES-074 as written, including the silent-vs-loud amendment
        (120ca67) that landed mid-mission: FindClaudePID is now a per-call
        resolver (no sync.Once) that prefers CLAUDE_PID, corroborated against
        the caller's live process ancestry (isLiveAncestor, ported from biff
        DES-058) before trusting it, falling back to the existing topmost-walk
        when the env var is absent or fails corroboration.

        resolve.SessionID no longer returns a silent ("", "") pair. It returns
        three outcomes: resolved (id, source, nil); not running under Claude
        Code at all -- a normal state, (id="", source="", nil); or a session
        was expected but unresolvable -- ErrNoSession, non-zero exit, remedy
        named. process.UnderClaudeCode (CLAUDE_PID, CLAUDECODE, or a claude
        ancestor) is the signal distinguishing the two failure states, per the
        amendment. resolveFromSession also now fails loud (never silently) when
        a session ID DID resolve but its roster is unreadable or has no
        matching participant -- two of DES-074's three measured wrong-answer
        cases. Added a bounded read retry (DES-074 point 5) for the
        SessionStart-hasn't-finished-writing race, gated on UnderClaudeCode so
        it adds no latency to the common no-session path.

        Seven call sites named in the contract turned out to be eight across
        seven files (internal/resolve/resolve.go has two): four are session
        lookup (resolve.go's SessionID; hook/session_start.go's
        WriteCurrentSession; hook/session_end.go's DeleteCurrentSession;
        cmd/ethos/session.go's runSessionEnd) and get the corroboration +
        no-caching fix automatically, no code change needed beyond the
        internal/process rewrite. Four are participant/agent identifiers
        (cmd/ethos/iam.go, resolve.go's resolveFromSession, internal/mcp/
        tools.go's handleIam, hook/subagent_start.go's Parent field) -- a
        different question (which PID names a roster participant, not which
        session's pointer file to read) -- left calling FindClaudePID
        unchanged; they get the same underlying PID-stability fix for free
        without needing any session-error-handling change, since a
        participant/parent identifier and a pointer-file key both want "my/my
        parent's owning claude PID," just for different purposes. Not silently
        repointed to anything else.

        Regression tests: TestSessionID_ConcurrentSessionsDoNotCollide (store-
        level, two distinct PID keys never collide) +
        TestStore_CurrentSession_DistinctPIDsDoNotCollide (same, in
        internal/session); TestSessionID_ResolvesAcrossSessionChange (pins the
        sync.Once removal -- a long-lived process resolves the SECOND session
        after a pointer-file rewrite, not the first);
        TestSessionID_UnresolvableIsNamedError +
        TestResolveSession_UnresolvableIsNamedErrorNotGitOSFallback (CLI-level,
        non-zero exit, remedy named, no git/OS fallback). Plus
        TestSessionID_RetriesPointerFileRace /
        _RetrySkippedWhenNotUnderClaudeCode for point 5, and
        TestFindClaudePID_PrefersLiveEnvPID / _FallsBackWhenEnvNotLiveAncestor /
        _NoProcessLifetimeCaching / TestIsLiveAncestor / TestUnderClaudeCode at
        the process-package level.

        Every test asserting the walk-fallback path explicitly strips
        CLAUDE_PID (and, where the ancestor-walk signal also needed defeating,
        forces resolve.UnderClaudeCode or sets
        process.ForceNotUnderClaudeCodeEnv) -- this suite runs inside a real
        Claude Code session, where CLAUDE_PID is genuinely set and a real
        claude ancestor genuinely exists several hops up any spawned test
        binary's process tree.

        `make check` (golangci-lint, shellcheck, ruff, mypy, pytest,
        markdownlint, `go test -race`, validate-content) passes clean. No
        suppressions added. Commits are incremental, one logical step each, all
        green.
