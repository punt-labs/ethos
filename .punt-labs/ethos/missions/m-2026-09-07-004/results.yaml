      prose: |
        Closes the CI-verification gap identified in the round 2 reflection.
        Every item explicitly named:

        CI failures (2 -> 6 at f40496d) -- all six were the SAME defect class,
        now fixed at the class level, not per-instance: TestFindClaudePID_
        NoProcessLifetimeCaching, TestResolve_TolerlatesLegacyKeyedParticipant,
        TestRunIam_UpdatesLegacyKeyedParticipant,
        TestHandleSubagentStart_ParentLine_ToleratesLegacyKeyedPrimary,
        TestHandleIam_UpdatesLegacyKeyedParticipant, and
        TestHandleMission_CreateNoSessionInContextWarns all forced CLAUDE_PID
        to a value expected to differ from walkToClaudeAncestor's fallback
        (os.Getppid() with no real claude ancestor) or depended on
        resolve.SessionID's err==nil silently meaning "resolved". Fixed the
        root causes:

        1. Added process.ParentPID (exported) so a test can force CLAUDE_PID
           to a SECOND, always-distinct, genuinely live ancestor (the caller's
           grandparent) instead of relying on the walk's fallback differing
           from the forced value -- true only inside a live Claude Code
           session, false in any detached/CI environment. Applied to all five
           "legacy vs preferred PID" tests plus the cache test.
        2. resolve.SessionID now returns a second, distinct sentinel --
           ErrNotUnderClaudeCode -- instead of nil for "not under Claude Code
           at all", closing the err==nil-means-two-different-things gap three
           independent call sites (bindDispatchedMission,
           clearClosedMissionBindings, resolveSessionID) were built on.

        Cache-detection test rebuilt (see open_questions for the technique
        note): TestFindClaudePID_NoProcessLifetimeCaching now forces two
        DIFFERENT real ancestors across two calls and asserts the second call
        returns the SECOND ancestor specifically, not merely "differs from the
        first" -- verified this fails if sync.Once is re-introduced.

        The two tests pinning nothing (TestStore_CurrentSession_
        DistinctPIDsDoNotCollide, TestSessionID_ConcurrentSessionsDoNotCollide)
        -- fixed the resolve-level one to drive its keys through real
        process.FindClaudePID calls under two simulated sessions (parent-owned,
        grandparent-owned); deleted the store-level one as redundant with the
        pre-existing TestStore_CurrentSession.

        Added, per direct request: TestHandleSessionStart_
        WriteKeyAgreesWithLaterReadKey, running the real SessionStart write
        path and a real, separate resolve.SessionID read against the same
        environment, proving they agree -- previously only assumed from
        CLAUDE_PID's documented process lifetime.

        DES-074 amended: the sentinel decision, the two test-quality findings
        and their resolutions, a more precise "distinct per nesting level"
        correction (nested `claude -p` gets its own CLAUDE_PID; a Task-tool
        subagent or hook subprocess inherits its leader's verbatim), and the
        R7 audit conclusion made explicit (subagent_start.go's Parent field is
        a display cross-reference to the ONE shared leader, for which sharing
        CLAUDE_PID is correct, not a bug -- verified subagent participant
        records key on Claude Code's own literal agent_id, never on
        CLAUDE_PID).

