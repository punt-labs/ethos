context: 'Redispatch of abandoned m-2026-08-21-007 with one added item. Review-cycle fix round on branch chore/cut-ml-smalltalk-team (not a fresh branch). Four findings: (1) .punt-labs/ethos/agents/{kpz,ylc,kwb}.md are still-tracked stub files; InstallAgentDefinitions (internal/hook/agent_installer.go) copies any stub whose handle isn''t in GeneratedAgentHandles (built from team membership, internal/hook/generate_agents.go:236-244) into .claude/agents/ — so removing these 3 from engineering.yaml means their stubs get silently re-copied into .claude/agents/ on the next SessionStart. Empirically confirmed: 6 other untracked .claude/agents/*.md files (ahj, bne, csl, rej, srn, tdt) already exhibit exactly this pattern. (2) .punt-labs/ethos/agents/rej.md:37 has a dangling ''Pair with kwb (smalltalk-specialist) on green-field implementation'' line — kwb is being cut from the team, so this collaboration instruction points at someone no longer resolvable. (3) internal/mission/store.go:1043-1046 Store.Close() maps any non-VerdictFail result verdict to DelegationVerdictPass, silently swallowing VerdictEscalate — filed as ethos-15mp (P1, this ticket). Reproducible: closing m-2026-07-26-013 (escalate-verdict) just flipped its two delegation records to verdict: pass, already committed on this branch, even though the mission''s own result.yaml says verdict: escalate. (4) .punt-labs/ethos/missions/m-2026-08-21-006/results.yaml has author: bwk but was authored by claude (leader submitted on worker''s behalf, per the file''s own prose).'
