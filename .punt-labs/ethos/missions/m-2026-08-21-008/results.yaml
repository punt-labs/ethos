      prose: |
        Removed the three still-tracked stub agent files (kpz.md, ylc.md,
        kwb.md) that InstallAgentDefinitions would otherwise silently
        re-copy into .claude/agents/ on the next SessionStart, since their
        handles are no longer in GeneratedAgentHandles. Verified empirically
        with a real ethos hook session-start run: the three files do not
        reappear. Removed rej.md's dangling "Pair with kwb" line and
        confirmed via grep that no other tracked agent file references
        kpz/ylc/kwb.

        Fixed Store.Close's delegation-verdict mapping (ethos-15mp):
        VerdictEscalate now maps to DelegationVerdictAborted instead of
        falling through to DelegationVerdictPass; VerdictFail and
        VerdictPass behavior is unchanged. Added
        TestStore_Close_EscalateVerdictAbortsOpenDelegations, which submits
        an escalate-verdict result against a mission with an open delegation
        skeleton, closes it, and asserts the delegation record ends up
        verdict: aborted.

        Hand-corrected the two already-committed delegation records at
        m-2026-07-26-013 (d-2026-07-26-071, d-2026-07-26-075) from
        verdict: pass to verdict: aborted, matching the fixed mapping — the
        mission is already closed, so this corrects committed data rather
        than re-running Close.

        Corrected m-2026-08-21-006/results.yaml's author from bwk to claude,
        since the leader submitted that result on the worker's behalf (per
        the file's own prose); the contract's worker: field already
        correctly records bwk.

        Added a CHANGELOG entry under Unreleased > Fixed describing the
        delegation-verdict mapping bug.

