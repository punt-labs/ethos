context: 'Two related findings on branch feat/vendor-repo-only, closing out the vendor prune-misreport fix completely (ethos-823n''s fix missed a third surface, and its test doesn''t exercise the real adversarial case). (1) internal/hook/format_output.go''s formatVendor -- the function that rewrites raw MCP tool JSON into the compact summary an agent reads in its transcript -- prints ''No longer in the closure (N): file1, file2...'' whenever pruned is non-empty, regardless of applied/prune. An agent driving vendor via MCP with apply=true and no prune=true sees files listed as ''no longer in the closure'' with zero indication they still exist on disk. (2) cmd/ethos/vendor_test.go''s TestVendorApplyJSONWithoutPruneReportsPruneFalse runs against a fresh destination with nothing to prune, so pruned ends up empty/absent -- it never actually tests the adversarial case (non-empty pruned + prune:false together).'
