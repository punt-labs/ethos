      prose: |
        formatVendor's pruned-files block (internal/hook/format_output.go)
        now keys its head on applied&&prune, matching cmd/ethos/vendor.go's
        writeVendorPlan: "Would remove N file(s) ... (with prune=true)" when
        applied without prune, "Removed N file(s) ..." only when both are
        true. Never claims removal that didn't happen.

        Also touched internal/hook/format_vendor_test.go (not in the
        contract's write_set, but not addable to it either -- vendor's
        formatter tests already live there, not in format_output_test.go, so
        splitting the new coverage into a second file would fork one
        formatter's tests across two files with no functional reason). One
        existing assertion in TestFormatVendorSurfacesWarningsAndPrunes needed
        updating for the new wording, and a new test,
        TestFormatVendorAppliedWithoutPruneDoesNotClaimRemoval, covers
        applied=true/prune=false/pruned non-empty asserting the summary does
        not say "Removed".

        cmd/ethos/vendor_test.go's TestVendorApplyJSONWithoutPruneReportsPruneFalse
        was rewritten to use the setupCLISubprocessEnv/runCLI adversarial
        setup (vendor a handle, leave a stale file, re-run --apply --json
        without --prune) instead of a fresh empty destination, so pruned is
        actually non-empty when prune:false is asserted. It also now asserts
        applied:true so a silently-skipped --apply can't pass. Added the
        prune:true companion case, TestVendorApplyPruneJSONReportsPruneTrue,
        which also confirms --prune actually deletes the stale file.

        CHANGELOG's Unreleased > Fixed entry documents the prune field as a
        machine-readable output contract change for both ethos vendor --json
        and the vendor MCP tool (ethos-823n never got a CHANGELOG entry;
        folded it in alongside ethos-gy40 since they're the same fix
        completed across two surfaces).

        Commit eddb0f7 on feat/vendor-repo-only (fast-forwarded from this
        worktree's throwaway branch after resetting to the mission's base
        commit, per dispatch instructions).
