    - 'TDD: write a test that simulates an existing install — seed once with a manifest that has the three old skill entries + their files on disk, then run the retirement and assert (a) an unmodified old skill file is removed and its manifest entry dropped, (b) a user-MODIFIED old skill file is LEFT in place with its manifest entry, (c) baseline-ops is never touched, (d) the three dirs do not reappear on a subsequent seed. Confirm the test fails before the retirement code exists.'
