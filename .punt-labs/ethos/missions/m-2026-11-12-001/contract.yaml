context: 'Branch fix/skills-to-plugin in worktree <repo>/.worktrees/skills-plugin. This PR moved three discoverable skills (mission, create-from-project, optimize-team) from the seed path to plugin/skills/. Qodo found a real upgrade bug: removing them from the //go:embed Skills list stops FUTURE seeding, but ethos seed never deletes previously-seeded files, so an existing user who upgrades and re-runs ethos seed keeps the stale ~/.claude/skills/{mission,create-from-project,optimize-team}/SKILL.md AND gets the new plugin-namespaced ones — duplicate skills. OKINOS NOTE: make check fails in internal/gitenv for an unrelated env reason (PL-318); verify with go build ./... and go test ./internal/seed/. Commit on this branch only; no push/PR/merge; git add explicit paths.'
