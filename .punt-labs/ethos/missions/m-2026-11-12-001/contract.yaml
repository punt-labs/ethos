    - 'Add a retirement step so ethos seed removes the three FORMER top-level skills from the global skills root (~/.claude/skills/) ON UPGRADE, SAFELY. The seed Manifest (internal/seed/manifest.go) already records the content hash of what seed last wrote to each path (''lets a later seed tell an unmodified shipped file from a user edit'') — use it. For each of the three slugs mission, create-from-project, optimize-team: if the manifest has an entry for its skills-root path AND the on-disk SKILL.md content hash still matches the recorded hash (unmodified shipped copy), delete the <slug>/ dir under skillsRoot and remove its manifest entry. If the file is user-modified (hash mismatch) or has no manifest entry (seed did not write it), LEAVE it untouched — never clobber a user edit. Record removals in the seed Result so they surface to the user.'
