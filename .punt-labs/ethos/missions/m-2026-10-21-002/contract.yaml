success_criteria:
    - 'Fix a structural harness-parity defect the operator identified by reading internal/enable/enable.go directly: that file''s deposit logic (CanonicalImport = ''@.punt-labs/ethos/CLAUDE.md'', claudemd.Register) is itself Claude-Code-specific, not harness-neutral. The design''s current Sec5 point 4 and Sec1.1 propose ''ethos enable --opencode'' as a flag bolted onto this existing Claude-Code-flavored ''ethos enable'' command. That shape is wrong: it makes Claude Code the unqualified default and OpenCode an opt-in qualifier, which contradicts the spec''s own HarnessNeutrality theorem in spirit even though the Registry data model itself stays neutral. Restructure the design (and DESIGN.md''s DES-078 mirror) so neither harness is privileged: propose something like ''ethos enable claude'' / ''ethos enable opencode'' as coequal subcommands (or an equivalent flagging scheme with NO privileged bare form that silently means Claude Code), each depositing that harness''s own native artifact -- the existing CLAUDE.md import for Claude Code, the opencode.json plugin registration for OpenCode -- with neither implied by the other. A repo using both harnesses runs both commands explicitly; running one must not silently also enable or skip the other.'
    - 'Add a new subsection (or expand Sec2 appropriately) stating a confirmed fact the operator surfaced and the leader verified directly against docs/spec-opencode-integration.tex Sec''Harness Instantiation'': the design''s fork-propagation machinery (Sec2.2, Sec2.3, Sec2.3.2''s claim-forked primitive) is NOT OpenCode-specific and must not be framed as if it were. The spec''s own Harness Instantiation section, Case 2 (''--fork-session//''), found on direct verification that Claude Code''s own --fork-session, /fork, and /branch commands mint a genuine new top-level session exactly like OpenCode''s session.fork, and a SessionStart hook already reports source: ''fork'' to distinguish it (cited: Claude Code v2.1.214, code.claude.com/docs/en/hooks.md). The spec states Claude Code''s ForkNeverInheritsClaim guarantee is NOT vacuous for this case and needs the SAME session-level claim-isolation treatment OpenCode gets -- but nothing in the current Go codebase (internal/mission/, internal/hook/) implements this for Claude Code today; the leader grepped and confirmed no AllocateDelegationForkPropagated-shaped primitive exists anywhere. State plainly in the design: claim-forked and the Roster.ParentSession field (Sec2.3.2) are harness-neutral Go primitives with NO OpenCode-specific logic in them; wiring Claude Code''s own SessionStart hook to call session create --parent-session and claim-forked when it observes source: ''fork'' is additional, closely related implementation work this design''s Sec5 should name as in-scope for the SAME implementation stage (not a separate future concern), since building claim-forked only for OpenCode and leaving Claude Code''s identical gap open would itself reintroduce a parity difference between harnesses.'
    - Review the rest of the document (all sections) for any other place where OpenCode is framed as an add-on, extension, or afterthought to a Claude-Code baseline rather than a coequal harness instantiation of the same Registry model, and correct the framing. Do not rewrite content that is already harness-neutral; this is a wording/framing audit, not new technical content, except for the two substantive items above.
    - Do NOT touch, read, or stage .punt-labs/vox/vox.md -- it has an unrelated uncommitted modification from the vox daemon that must be left alone. If your git add picks it up accidentally, unstage it before committing.
    - Run make check before each commit and record it in the mission result evidence.
    - Commit incrementally -- one commit per logical fix. Do not accumulate more than 30 minutes of uncommitted changes.
