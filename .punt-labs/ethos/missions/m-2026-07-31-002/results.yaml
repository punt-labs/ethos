      prose: |
        Two commits on the same branch/PR.

        00f05e5 activates Fix 2 where it matters. ResolveCheckout joins
        ResolveRepo and ResolveHost as the third binding the SessionStart hook
        resolves, and it delegates to resolve.EnvRepoRoot — the same resolver
        the live-write path uses — so the recorded path and the path the live
        file lands under agree by construction rather than by two walks that
        could drift. That drift is the class of mismatch ethos-q6e2 was.

        3491513 fixes the two purge tests. Both claimed a mission-namespace
        subject while never writing a live audit file, so liveGone was already
        true from the session-namespace probe before the mission loop ran —
        they passed whatever the mission logic did. After Fix 1 the first
        one's premise was dead outright: a sealed chunk now proves survival,
        so "sealed a chunk, live log gone" is not a loss, and store_test.go
        asserts exactly that. Each now seals its own live audit file first and
        they cover the two distinct halves of the binding union, a delegation
        record and the claim sidecar. A control case runs the same setup with
        the binding removed and must purge silently; without it neither
        assertion would mean anything.

        Verified end to end through the built binary rather than tests alone:
        a real roster now records its checkout, a non-writing checkout is
        silent where it used to print one warning per mission, and both
        genuine-loss cases still fire from a checkout that did not write them
        — which the old code could not distinguish from its own noise.
