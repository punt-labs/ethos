      prose: |
        Fixed cmd/ethos/vendor.go's writeVendorPlan: the "Removed" head now
        requires both p.Applied AND vendorPrune; --apply alone (no --prune)
        now reads "Would remove" and shows the "(with --prune)" hint, which
        previously only appeared on a plain dry run. Added
        TestCLI_VendorApplyWithoutPruneReportsWouldRemove, a subprocess CLI
        test that vendors a fixture identity, seeds a stale file, runs
        vendor --apply with no --prune, and asserts the output says "Would
        remove 1 file(s)" (not "Removed"), shows the "(with --prune)" hint,
        and that the stale file survives on disk. Verified the test fails
        against the pre-fix logic (temporarily restored HEAD~1's vendor.go,
        reran the test, got the "Removed"/no-hint failure the bug report
        describes) and passes against the fix. Added a CHANGELOG entry under
        Unreleased > Fixed citing ethos-7075. Three commits, one per
        write-set file, each preceded by a clean make check.
