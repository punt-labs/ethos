    - 'Fix ethos-n4tk in internal/hook/generate_agents.go: the emitted PostToolUse Write|Edit make-check hook currently runs ''cd $CLAUDE_PROJECT_DIR && make check'' in ALL branches (see the command string near line 388 and the cwd-pinning comment near lines 371-372). This runs make check against the MAIN repo, not the isolated git worktree a subagent edits when spawned with isolation=worktree — so it is blind to the agent''s changes, blocks on unrelated failures, and burns ~70s per edit. Change it so that when the edited file path is known (the matched-file-pattern branch), the hook resolves the repo root FROM THE EDITED FILE: _dir of the file path, then ''git -C _dir rev-parse --show-toplevel''; cd to that root and run make check there. If that resolution yields empty (git error, file outside a repo), fall back to $CLAUDE_PROJECT_DIR. The two fallback branches that have no file path (jq missing; empty .tool_input.file_path) keep using $CLAUDE_PROJECT_DIR.'
