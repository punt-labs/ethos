        docs/agent-identity-spec.tex claimed to match buildAgentFile, and the
        note was not the only place it had drifted. Three further defects, all
        fixed since the claim cannot be true while any of them stands:

          1. The Body Assembly Order enumeration omitted What You Don't Do,
             Safety Constraints, and Output Format.
          2. A Note directly under it asserted "There is no What You Do / What
             You Don't Do section today --- that is future work (Phase 2.1)".
             That section has shipped.
          3. The frontmatter table and the closing paragraph of the worked
             example listed `skills` and `hooks` as not yet generated. Both are
             generated: `skills` always, `hooks` for roles holding Write or Edit.

        Added a Tool Scope subsection explaining the harness behavior the block
        counters. The rmh worked example gains the note, the skills/hooks
        frontmatter, and a What You Don't Do section.

        The .tex is pure ASCII and its listings already transcribe em dashes as
        `---` (line 601 does this for rmh's personality). The note in the listing
        follows that convention and a sentence below the listing says so, rather
        than introducing the file's first non-ASCII byte inside an lstlisting,
        where pdflatex handles UTF-8 poorly.

        Three defects found in the markdown example while working in it and
        fixed: a duplicated `Talents: engineering` line, a missing blank line
        before `## Writing Style`, and a missing blank line after the
        What-You-Don't-Do preamble. The generator emits all three correctly.

        CHANGELOG untouched, per the contract. No PR opened.
