        Both docs enumerate the generated body section by section, so the
        tool-scope note falsified both. Fixed on branch fix/agent-tool-scope-note,
        commit f0b187d.

        docs/agent-definitions.md: eight sections becomes nine, the note is
        documented as section 2 with the reason it exists, and the abbreviated
        bwk.md example carries the block at its real position — after the
        reporting line, before the first personality heading. The example text is
