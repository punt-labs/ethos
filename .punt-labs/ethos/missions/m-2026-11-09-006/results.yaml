      open_questions:
        - 'GAP against the contract: ''a pending line whose ts already exists in an archived chunk is dropped from the live file'' is only true when a rewrite also happens. The existing archived-ts filter drops such a line from pending, but the live file is replaced only when some pending live line needed redaction. A live line that duplicates an archived ts with a different (unredacted) payload makes audit.ReadStream/MergeLines fail with ''audit identity conflict'' before sealPolicyStream runs. I did not handle that case or test it. It needs a change in internal/audit (read or merge side), which I judged beyond the named functions. Decision for the leader: fix in this PR or a follow-up.'
        - Seal still refuses a frozen legacy line, or a pending line from a non-live source, that the guard would change. Quarantine recovery still refuses an unsafe live line; its tests keep that behavior.
        - 'Unstaging runs on every commit and prints ''ethos: hook pre-commit: unstaged N path(s) under .punt-labs/local/; they stay on disk'' on stderr when N > 0.'
      prose: |
        Bug 1. sealPolicyStream (internal/hook/audit_repository.go) no longer refuses a pending line the guard
        would change when that line came from the live file. It runs the line through the stream's guard, replaces
        the live file with audit.ReplaceLocalFile, then archives. Frozen legacy and non-live-source lines still
        refuse. Test: TestShimEnabledUnredactedLiveLineIsMigratedByCommit (plugin/hooks/shim_commit_test.go) runs
        a real git commit through the installed shim against a binary built from the tree, with a live line
        holding tool_input command 'cat ~[redacted-user]/notes.txt'.

        Bug 1 before the fix (base commit):
          shim_commit_test.go:416: output should not contain "retained-data warning":
            "ethos: audit seal: archiving stream [...] (live data retained): audit payload at ts 1000 requires
             redacted migration or explicit operator cleanup before immutable archival; original source retained
             ethos: audit seal: retained-data warning: local archival incomplete; live data retained; ..."
          shim_commit_test.go:417: no file keeps the unredacted path: Should be empty, but was
            [.../.punt-labs/local/ethos/sessions/s-old.audit.jsonl]
          shim_commit_test.go:421: the second commit has nothing to warn about: output should not contain "audit seal"
          --- FAIL: TestShimEnabledUnredactedLiveLineIsMigratedByCommit (4.03s)
        Bug 1 after the fix:
          --- PASS: TestShimEnabledUnredactedLiveLineIsMigratedByCommit (3.91s)

        Bug 2. ethos hook pre-commit (cmd/ethos/hook_precommit.go) calls the new gitenv.UnstageUnder first. It
        lists the index paths under .punt-labs/local/ and runs git rm --cached -q -- over them, under
        gitenv.ActualIndexEnv(), through gitenv.Read. It prints one line naming the count, and exits 2 with git's
        message on any git failure. Files stay on disk. Test: TestShimEnabledUnstagesLocalPaths covers git add -f
        then commit, a path HEAD already tracks (staged for removal), the files staying on disk, and a clean
        commit printing nothing. internal/gitenv/unstage_test.go adds TestUnstageUnder,
        TestUnstageUnderEditsTheGivenIndex (a private GIT_INDEX_FILE is the one edited) and
        TestUnstageUnderGitFailureCarriesGitsMessage (corrupt index).

        Bug 2 before the fix:
          shim_commit_test.go:447: output does not contain "unstaged 1 path(s) under .punt-labs/local/"
          shim_commit_test.go:448: ".punt-labs/local/ethos/forced.txt\nf.txt\n" should not contain ".punt-labs/local/"
          shim_commit_test.go:461: output does not contain "unstaged 1 path(s) under .punt-labs/local/"
          shim_commit_test.go:462: ".punt-labs/local/ethos/forced.txt\n.punt-labs/local/ethos/tracked.txt\nf.txt\n"
            should not contain ".punt-labs/local/"
          --- FAIL: TestShimEnabledUnstagesLocalPaths (6.05s)
        Bug 2 after the fix:
          --- PASS: TestShimEnabledUnstagesLocalPaths (5.47s)

        Updated tests (the old refusal became redaction in place), none deleted:
        TestSealRepo_RefusesRewritingLeakingLiveLines -> TestSealRepo_RedactsLeakingLiveLinesInPlace;
        TestSealRepo_RefusesCaseCollidingTs -> TestSealRepo_MarksCaseCollidingTsAsLoss;
        TestSealRepo_RefusesACredentialInAnOlderLiveLine -> TestSealRepo_RedactsACredentialInAnOlderLiveLine;
        the shared helpers assertImmutableSealRefuses/sealedLines became sealMigratesLive/sealedLines, which
        covers TestSessionLineGuard_NoHomeStillRedactsCredentials, _RedactsHeadersAndUnknownFields/seal,
        _UnusableHomeRedactsAShortAssignment, TestCredentialPassLine_MarksTheLineRedacted and
        _CaseVariantInputIsALossMarker; TestMissionLine_UnsafeLegacySourceIsRetainedOnSealAndRecovery ->
        TestMissionLine_UnsafeLiveLineIsRedactedOnSealAndRetainedOnRecovery (seal redacts, quarantine still
        refuses); TestRepositorySealNoticeImmutablePayload (unsafe case asserts in-place redaction and that the
        archive equals the redacted live file).

