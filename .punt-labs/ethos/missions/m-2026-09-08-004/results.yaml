      prose: |
        All 13 findings (C1-C13) from the three local reviewers addressed, plus
        the round-2 addendum's escalation of C2 and C7's follow-up questions.

        The three critical/blocker findings (C1, C2, C3) required a genuine
        redesign rather than three separate patches: pending dispatch bindings
        moved off the single active-mission slot entirely into a new per-mission
        store (internal/mission/active.go's dispatch-pending/ directory, one
        file per pending dispatch, keyed by mission ID). This single change
        closes all three simultaneously --

          - C1: two pending dispatches to the same Worker now coexist as two
            files instead of overwriting one slot; resolved FIFO (oldest
            first) on matching spawns, matching CLAUDE.md's own
            dispatch-then-spawn protocol.
          - C2: dispatch no longer touches the active-mission/origin pair at
            all, so the "defaults to claim on ambiguity" reader behavior --
            dangerous only because dispatch USED to share that file -- is now
            always correct, because nothing but `ethos mission claim` writes
            there anymore. Not a patch to the default direction; removal of
            the shared, ambiguous encoding itself.
          - C3: matching no longer needs a contract Load at all (the Worker is
            recorded directly in the pending file at dispatch time), so the
            function that discarded Load errors (dispatchedWorker) is deleted
            outright. A subsequently-unloadable contract for an
            already-matched pending dispatch is now handled by dispatchTierB's
            existing Load-and-block gate, identically to an explicit
            MISSION_ID -- a deliberate, documented doctrine revision from
            round 1 (whose "never block" rule applied to PRE-match
            uncertainty that no longer exists once matching needs no Load).

        C7 (delegations refused before their worker ever ran blocking Abandon
        exactly like captures, and disclaim's provenance-only gate unable to
        tell the two apart) is fixed with a mechanical, unconditional exclusion
        of verdict=aborted from Abandon's blocking gate, independent of
        BoundVia or disclaim -- justified by the fact that both write sites for
        that verdict fire before the worker process starts, and the third
        (Store.Close's escalate sweep) cannot reach any delegation
        countBlockingDelegations ever sees. Two alternatives (a distinct
        BoundVia value; narrowing disclaim to require verdict=aborted) are
        explicitly rejected and the reasoning written down, per the leader's
        direct question.

        C4-C13 (coverage gaps and stale prose) are all closed: a genuine
        subagent_type test where none existed before; HandleSessionEnd now
        clears both binding stores so `claude --resume` cannot inherit stale
        attribution; the MCP surface re-synced to the new storage design;
        four separate stale doc-comment claims corrected across
        commit_trailers.go, staleBindingReason, and two warning messages (one
        of which -- warnNonOpenMissionID -- deliberately does NOT get the
        suggested `ethos mission release` addition, with the reasoning written
        into the code, since none of its callers touch a clearable sidecar).

        DES-076 is amended with a full round-3 write-up and, per the leader's
        explicit closing instruction, an honest residual-risk enumeration:
        same-worker-type-different-task capture (unchanged since round 1),
        FIFO out-of-order-spawn misattribution (a genuinely new tradeoff this
        redesign introduces), persistent-filesystem-failure degradation across
        three remedies at once (not just consumeDispatchBinding), and the
        unverified plaintext trust boundary on pending-dispatch files. None of
        these are claimed to be closed by this round.
