      prose: |
        Implements the follow-up DES-076's round-1 Non-goal section recommended,
        funded by m-2026-09-08-004 after the leader corrected the round-1
        write-set scoping error.

        Part 1: Delegation and DelegationSkeleton gain a BoundVia field (closed
        set: mission_id_env, inherited, active_mission_sidecar_claim,
        active_mission_sidecar_dispatch), set by dispatchTierB at the exact call
        site that already knows which admission path produced a spawn. Empty
        string is the zero value for every pre-existing delegation and is never
        treated as disclaimable -- verified against a real on-disk record from
        this repo's own mission tree, before and after.

        Part 2: DisclaimDelegationRecord (delegation.go) mechanically gates a
        disclaim on three checks -- BoundVia must be exactly
        active_mission_sidecar_dispatch, Verdict must not be open, not already
        disclaimed -- and Store.DisclaimDelegation (store.go) wraps it with the
        same repo-tier exclusive lock and audit-log discipline Abandon's own
        gate 1 uses, plus rollback-on-event-append-failure (added after
        self-review surfaced the gap; confirmed red via git stash before
        fixing). Abandon's gate 1 now counts via countBlockingDelegations,
        which excludes disclaimed entries; countDelegations is unchanged and
        still backs ForceReleaseWriteSet's unfiltered informational snapshot --
        validated by reading both of its call sites before repointing only one.

        No bypass flag anywhere: the only lever is a per-delegation,
        operator-named, mechanically-checked disclaim, exposed identically on
        the CLI (`mission abandon --disclaim <id>`, repeatable) and the MCP
        `mission` tool (`disclaim` array param on method=abandon). Gate 2
        (results) is completely untouched -- a mission with a submitted result
        still refuses regardless of any disclaim.

        Full security review (three explicit questions the contract required,
        plus what was checked for each) is written into DES-076's round 2
        section in DESIGN.md: (1) yes, a disclaim can in principle retire a
        mission whose matching-worker-type spawn did real but never-submitted
        work -- mitigated by gate 2, the mandatory --reason, and the permanent
        audit trail, not eliminated, because that residual judgment call is
        deliberately left to the operator, the same trust the codebase already
        places in Abandon's and ForceReleaseWriteSet's own --reason; (2) yes, a
        hand-edited bound_via on disk can unlock the path -- not a new gap,
        the same trust boundary as hand-editing any other git-tracked mission
        field; (3) yes, twice over -- the delegation record's own
        disclaimed_at/disclaimed_reason, and the mission's disclaim_delegation
        event, both permanent.

        DES-076's heading changed from "PARTIAL" to "SETTLED" and its Non-goal
        section was replaced with the round 2 decision record, per the
        no-stale-comments discipline from PR #508's review rounds.

        Four commits, one per logical step, each passing make check:
        bind-provenance field + disclaim path (delegation.go/store.go), CLI+MCP
        surfaces, CHANGELOG correction, and the rollback hardening a self-review
        pass surfaced.
