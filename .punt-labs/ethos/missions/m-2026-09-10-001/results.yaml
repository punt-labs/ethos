      open_questions:
        - 'Residual left open, documented in DES-077 addendum 3: a setsid-detached hook child escapes process-group cleanup. No portable, unprivileged containment exists across shipped targets (PR_SET_CHILD_SUBREAPER is Linux-only; darwin needs cgroups or ptrace). Lifetime containment was never the security boundary — hook execution is untrusted-code execution by design.'
        - No Windows CI job. Three Windows-only defects reached review with every check green, one introduced by this branch. Every Windows guard here is verified by construction (build tag, seam override, or citation of Go's source), never by observation. Filed as ethos-ell5 (P1).
