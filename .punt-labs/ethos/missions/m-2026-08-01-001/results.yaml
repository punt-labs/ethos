      prose: |
        Coverage is now git's answer, not a string comparison. Both surfaces
        ask `git check-ignore --no-index` about a probe path — a path git has
        never seen, since check-ignore reports an indexed path as not ignored
        — so any rule that already excludes machine-local files counts,
        including the canonical .punt-labs/**/*.local.* from #422, a legacy
        narrow rule, a whole-subtree rule, or one in .git/info/exclude. The
        literal pattern line still counts on its own: when git cannot answer
        (no git in PATH, not a work tree) it is all there is to go on, and it
        keeps a re-run from appending a duplicate even if a probe is a poor
        witness for its pattern.

        enable's two runtime patterns and the canonical machine-local rule are
        one rule table now, each rule carrying its probe and, where it needs
        one, the comment written above it. The machine-local rule keeps its own
        label — the runtime zones must stay untracked because the seal hook
        rewrites them, this one because it may hold secrets, and one label for
        both would mislead whoever reads the .gitignore next. For the same
        reason the already-tracked warning still covers only the runtime zones:
        a tracked .local file is a secret in git, which doctor FAILs on.

        LocalIgnoreRule, LocalIgnoreNote, and LocalIgnored are exported from
        internal/enable so setup, vendor, and enable share one predicate and
        one spelling; cmd/ethos/gitignore_local_ext.go no longer imports
        doctor.

        Doctor needed no change — gitignoreCovers was already check-ignore —
        so internal/doctor/doctor.go and internal/enable/enable.go went unused
        in the write-set. Two commits, make check green on each:
        34281fd (enable), fdbf4e1 (setup/vendor).
