prose: |
    Outside the write set, forced by the RedactLive signature and committed in 5397385: internal/audit/recover_test.go (one call, +2/-1) and internal/hook/audit_repository.go (one call, +2/-1). Neither is in files_changed because the gate refuses them.
    Choices. Live-tails uses the chunked option: RedactLive(ctx, p, s, guard, limit) judges at most limit lines past a cursor (byte offset plus sha256 of the prefix, stored under LocalRoot/cursors/live-<hash>.json), rewrites that prefix atomically, and records the new cursor; a replaced or edited prefix invalidates the cursor. limit 0 keeps the old whole-file behaviour for the seal. redactLiveChunks loops 100-line chunks until Complete or ctx done; a ctx expiry returns Deferred. ImportGlobalAudit takes ctx and reports Remaining; the step marks Deferred. liveSteps.wait(log, deadline) stops waiting at EnsureBudget, logs action "abandon" ('abandoned step still running'); the existing 'wait' log line is kept. The ADR citation is left to the leader. Tests: step stubs replace the guard via package vars liveGuard and sessionGuard.
