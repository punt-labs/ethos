    - 'F3 (Swift/other languages) + F2 (personality content): F3 — the decision table (~lines 66-73) maps a non-Go/Python primary language to ''other/none'' with no implementer seat, which would prune a real Swift specialist pair in a Swift repo. Fix: add an interview path that proposes an implementer+distinct-reviewer pair for any primary language, not just Go/Python. F2 — writing an identity YAML referencing a personality/writing-style slug does not create that content; if the slug isn''t resolvable, agent generation skips the member. Fix: the write flow must use personality/writing-style slugs that already resolve (or stage their markdown), and validate every proposed member actually resolves before cutover. Keep these two concise.'
