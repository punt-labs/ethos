    - 'F7 (team edge type) VERIFIED: internal/team/team.go:22-25 Collaboration requires a Type field, and validCollabType accepts only reports_to|collaborates_with|delegates_to (CollaborationTypes, team.go:44). The SKILL (lines ~104-109 and the write-flow ~219-222) tells the model to write review edges with only from/to — that produces a team ethos REJECTS at load. Fix: every review edge must specify type (use ''reports_to'' from worker-role to reviewer-role, matching the gstack team''s convention — verify against internal/seed/sidecar/bundles or the engineering team YAML). Show a complete, valid 3-field YAML edge example.'
    - 'F9 (vendor --yes is fiction) VERIFIED: cmd/ethos/vendor.go has NO --yes flag and no confirm prompt. Its real safety model is: --dry-run is the default (plan only), --apply writes. The SKILL step 8 (~lines 232-240) says ''run without --yes so the user sees the prompt'' — false. Fix: the procedure runs ''ethos vendor --team <t> --prune'' (no --apply) FIRST to show the deletion plan, presents that plan to the user via AskUserQuestion, and only on explicit consent runs it again with --apply. Remove every mention of --yes and of a vendor-provided prompt.'
    - 'F4 (doctor can''t check a staged tree) VERIFIED: ethos doctor (cmd/ethos/main.go:185, runDoctor:276) locates and checks the LIVE repo; it takes no staged-root argument. The SKILL step 7 (~lines 224-231) says ''run ethos doctor against the staged closure'' — doctor cannot do that. Fix: drop the claim that doctor validates a staged temp dir. Instead, validate the proposed closure by the checks the skill CAN do (ValidateModel per model value; the strict-tier review-edge check; worker!=evaluator), then write to the live tree, then run ''ethos doctor'' on the result and, if it FAILs, restore from the backup the skill already made. Make the backup-and-restore the real safety net, since the validation-before-write is now skill-side not doctor-side.'
    - 'F5 (agent files not auto-pruned) VERIFIED: internal/hook/agent_plan.go writes current members'' agent files but never removes a pruned member''s file (the only os.Remove is a staging temp). doctor flags it as orphaned. The SKILL (optimize-in-place section, ~line 256) promises ''the agent file disappears on the next SessionStart regeneration'' — false. Fix: state the truth — pruning a member removes it from team YAML, but its generated .claude/agents/<handle>.md is NOT auto-deleted; it is flagged orphaned by ethos doctor and the user removes it (or it is left as inert). Do not promise automatic deletion.'
