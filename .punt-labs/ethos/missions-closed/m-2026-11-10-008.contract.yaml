success_criteria:
    - 'Test first, each failing on 945cacb and passing after; paste both outputs in the result. (1) internal/auditimport: ImportGlobalAudit takes a context.Context and returns after the file in progress when ctx is done, reporting the remaining files as not attempted (a new field on AuditImportResult, e.g. Remaining int), and the step records Deferred=true when Remaining>0; a test with a guard stub that sleeps and a ctx that expires after the first file proves it stops after one file. (2) internal/audit.RedactLive takes a context.Context and checks it per line; when ctx is done mid-stream it writes nothing and returns ctx.Err(); a test proves that. (3) runLiveTails makes progress across runs: a stream that cannot be finished in one budget is not retried from scratch. Choose one of: process one stream per step run and record Deferred so the next Ensure continues with the next unfinished stream (streams already clean are skipped by the existing archive comparison), or chunk the live file (RedactLive takes a line limit and rewrites the prefix it finished, atomically, so the next run starts past it). Either way a test with a 3-stream fixture and a guard that is slow proves the step completes all three streams across N runs and then returns Deferred=false, and the engine test proves the stamp is written after those runs.'
    - 'The engine must not wait unboundedly for an abandoned step inside the user''s command. Change liveSteps.wait so that after the Ensure budget (EnsureBudget, 30 s) it stops waiting: log ''abandoned step still running'' and return; the step goroutine keeps its step lock until it finishes (the lock is what protects the next run) and the process exit ends it. A test with a step that blocks on a channel proves Ensure returns within EnsureBudget+1s and the step lock is still held while the goroutine lives. Update the engine.go comment that says ''After the Ensure budget is spent the wait is unbounded by design'' and the ADR citation is the leader''s job, not yours.'
    - 'Make the guard cheaper where it is free: in lineguard, compile-once and reuse anything built per call (check SessionLineGuardFor, GuardAuditLineFull, valueRuleIn, RedactLegacyLine for per-call regexp.MustCompile, strings.NewReplacer or PathRedactor construction) and add a benchmark BenchmarkSessionLineGuard over a 200-line fixture (copy representative shapes from internal/autorepair/testdata/corpus, no real paths) with the before/after ns/op in the result. Do not change what the guard redacts: internal/lineguard and internal/redact tests must pass unchanged. If no per-call allocation exists, say so with the profile and skip this item.'
    - 'Run on the demo copy and paste the output: DEMO=/private/tmp/ethos-demo and DEMO_HOME = the directory named home directly under DEMO; cd DEMO/punt-kit and run: env -u CLAUDE_SESSION_ID -u CLAUDECODE HOME=DEMO_HOME PATH=DEMO/bin:(existing PATH) GIT_CONFIG_GLOBAL=/dev/null time ethos whoami, with DEMO/bin/ethos re-pointed at a binary built from your branch (go build -o DEMO/bin/ethos ./cmd/ethos; it is a symlink today, replace it). Acceptance: no single command exceeds 35 s; both stamps (DEMO_HOME/.punt-labs/ethos/layout.yaml and DEMO/punt-kit/.punt-labs/local/ethos/layout.yaml) exist after at most 12 commands; a 13th command prints nothing and returns in under 1 s. Paste the per-command timings and the final two stamp files. Never run the branch binary against your real home directory; only under HOME=DEMO_HOME.'
    - GOTOOLCHAIN=go1.26.5 go test -race -count=1 ./internal/autorepair/ ./internal/auditimport/ ./internal/audit/ ./internal/lineguard/ ./internal/hook/ ./cmd/ethos/ passes; go vet clean; gofmt clean; GOTOOLCHAIN=go1.26.5 go test -count=1 ./internal/resolve/ (the retired-path scanner) passes; make check-storage passes (paste its PASS lines). Set internal/autorepair in coverage-baseline.txt to the figure `go test -cover ./internal/autorepair/` prints on this host minus 0.1, never below 81.0; mention the figure.
    - 'Micro-commits: one per criterion group (importer ctx; RedactLive ctx + live-tails progress; engine wait bound; guard benchmark/compile-once; baseline). Each passes the suites above for its packages. First commit within 30 minutes.'
