context: 'Release blocker found by the upgrade demo of epic ethos-ftey (DES-084). Worktree <repo>/.claude/worktrees/sr-perf (repo = the ethos checkout this mission was created in), branch fix/self-repair-budget, based on fix/self-repair-integration at 945cacb. Measured on a copy of a real repo (115 global audit files, 67,794 lines; 7 live audit files, 5,246 lines, one stream of 2,246 lines) under an isolated HOME with the branch binary: the first command took 85 s, then 40 further commands took 8-9 s each and no stamp was ever written. Repair log: every run ends ''live-tails defer step live-tails: 5s abandoned: budget exceeded'' then ''stop pass stopped after abandoned step live-tails'' then ''wait waiting for abandoned step live-tails''. Cause, measured with a CPU profile: lineguard.SessionLineGuardFor costs ~3.5 ms per audit line (redact.leakRule via mission.PathRedactor.AuditLeakRule is 55%, redact.SecretsString/SweepSecrets 20%, all regexp backtracking), so (a) auditimport.ImportGlobalAudit (internal/auditimport/import.go:106) never checks ctx between its 115 files and runs 85 s past its 5 s budget while the engine waits for it (engine.go liveSteps.wait), and (b) runLiveTails (internal/autorepair/step_live_tails.go) hands a 2,246-line stream to audit.RedactLive, which cannot finish inside 5 s, is abandoned, and the stream is retried from scratch on every later command forever. Operator bar (2026-11-10): no crash, no hang, no blocked command; losses logged, never fatal. Commit on your branch; do not push, do not touch PRs or merge; no attribution lines; git add only files you changed.'
