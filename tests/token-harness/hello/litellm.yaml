# L6 hello-world LiteLLM proxy config.
#
# Declares one Anthropic-shape model that returns a canned response via
# LiteLLM's proxy-level `mock_response` (verified working on
# `litellm==1.81.9`). Registers custom_callbacks.token_capture as a
# CustomLogger so every successful request has its proxy_server_request
# body dumped to $TOKEN_CAPTURE_DIR/capture-<ns>.jsonl.
#
# Run: see ./run.sh.
model_list:
  - model_name: mock-anthropic
    litellm_params:
      model: openai/mock-model
      api_key: sk-fake-not-used
      mock_response: "hello from the L6 token-capture harness"

litellm_settings:
  callbacks: custom_callbacks.token_capture
  drop_params: True

general_settings:
  master_key: sk-litellm-test-hello-world
