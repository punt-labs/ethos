[project]
name = "e2e"
version = "0.1.0"
description = "Ethos L4 end-to-end test tier: claude --print against a mocked LiteLLM upstream."
requires-python = ">=3.13,<3.14"  # uvloop 0.21 drops asyncio.BaseDefaultEventLoopPolicy on 3.14
dependencies = [
  "litellm[proxy]==1.99.0",
  "pytest>=9.0.3,<10",
  "tiktoken>=0.8,<1",
]

[dependency-groups]
dev = [
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-pyyaml>=6.0,<7",
]

# Installed editable into its own venv so `from e2e import ...` resolves in
# tests, but never built or published — no [project.scripts], no PyPI target.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: full L4 end-to-end scenario (spawns a claude subprocess against a mock proxy)",
  "smoke: fast L4 subset that runs on every push",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
